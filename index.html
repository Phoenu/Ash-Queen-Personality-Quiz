  :root{
    --ink:#000;
    --gold:var(--accent);
    --gold-dim:#7d5a22;
    --gold-faint:rgba(242,167,59,.22);
    --purple:#7b1e86;
    --orchid:#c0459f;
    --ember:#f0592b;
    --text:#f3e9dc;
    --muted:#9a8aa0;          
    --wind:100ms;             

    --display:"MedievalSharp", Cinzel, Georgia, serif;

    --accent:#f2a73b;
  }

  *{box-sizing:border-box}

  body{
    background:var(--ink);
    color:var(--text);
    font-family:Karla,"Segoe UI",system-ui,sans-serif;
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }

  #quizBackground{
    position:fixed;
    inset:0;
    z-index:-1;
    pointer-events:none;
    background:var(--ink) center/cover no-repeat;
  }
  #quizBackground.has-art::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.2);
  }
  body.bg-off #quizBackground:not(.forced){display:none}

  body.has-scene .plate{
    background:rgba(0,0,0,.78);
    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
  }
  body.bg-off.has-scene .plate{
    background:var(--ink);
    backdrop-filter:none;
    -webkit-backdrop-filter:none;
  }

  .unroll{
    opacity:0;
    transform:rotateX(-38deg) translateY(-8px);
    transform-origin:top center;
    transition:opacity .45s ease, transform .6s cubic-bezier(.2,.75,.3,1);
  }
  .unroll.unrolled{
    opacity:1;
    transform:none;
  }
  @media (prefers-reduced-motion:reduce){
    .unroll{opacity:1;transform:none;transition:none}
  }

  .wrap{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding-block:40px;
    padding-left:18px;
    padding-right:18px;
  }

  .plate{
    position:relative;
    width:100%;
    max-width:680px;
    margin-block:auto;
    perspective:1400px;          
    border:1px solid var(--gold-dim);
    background:var(--ink);
    padding:clamp(26px,5vw,46px);
    transition:border-color .4s ease;
  }
  .plate::before{
    content:"";
    position:absolute;
    inset:6px;
    border:1px solid var(--gold-faint);
    pointer-events:none;
  }

  .screen{display:none}
  .screen.on{display:block}

  .omen{
    position:absolute;
    bottom:100%;
    left:50%;
    transform:translateX(-50%);
    margin-bottom:clamp(0px,1vw,8px);
    width:clamp(260px,46vw,440px);
    max-width:96%;
    height:auto;
    pointer-events:none;
    filter:drop-shadow(0 0 22px rgba(180,20,20,.35));
    animation:omen-wake .8s ease both;
  }
  .omen[hidden]{display:none}

  .omen.omen-alice{
    width:clamp(66px,9vw,96px);
    margin-bottom:clamp(6px,1.4vw,16px);
    filter:drop-shadow(0 0 20px rgba(23,240,241,.55));
    animation-duration:.28s;
  }

  @keyframes omen-wake{
    from{opacity:0;transform:translateX(-50%) translateY(10px)}
    to  {opacity:1;transform:translateX(-50%)}
  }
  .omen.fading{animation:omen-sleep 1.1s ease-in both}
  @keyframes omen-sleep{
    from{opacity:1;transform:translateX(-50%)}
    to  {opacity:0;transform:translateX(-50%) translateY(-6px)}
  }

  .omen.omen-alice.fading{
    animation-name:omen-snuff;
    animation-duration:.22s;
    animation-timing-function:ease-in;
  }
  @keyframes omen-snuff{
    from{opacity:1;transform:translateX(-50%) scale(1)}
    to  {opacity:0;transform:translateX(-50%) scale(.72) translateY(3px)}
  }
  @media (prefers-reduced-motion:reduce){
    .omen{animation:none}
  }

  .plate.hers,
  .plate.hers::before,
  .plate.taken,
  .plate.taken::before{border-color:transparent;transition:none}
  .plate.hers .standing,
  .plate.hers .cog,
  .plate.taken .standing,
  .plate.taken .cog{display:none}

  .plate.moody{
    border-color:var(--mood);
    transition:border-color .45s ease;

    --gold:var(--mood);
    --gold-dim:color-mix(in srgb, var(--mood) 52%, #000);
    --gold-faint:color-mix(in srgb, var(--mood) 26%, transparent);
    --text:var(--mood);
  }
  .plate.bare .selector{display:none}

  .plate.solo .standing,
  .plate.solo .cog,
  .plate.solo .footer{display:none}

  .statement-line{display:block}

  .aside-hold{
    min-height:clamp(150px,30vh,240px);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .interject{
    margin:0;
    padding:clamp(16px,3vw,24px) clamp(20px,4vw,34px);
    max-width:100%;
    border:1px solid #675972;
    background:rgba(69,50,76,.42);
    color:#b9a6c9;
    font-family:var(--display);
    font-size:clamp(17px,3.2vw,24px);
    letter-spacing:.03em;
    text-align:center;
    text-wrap:balance;
    opacity:0;
    transform:translateY(8px);
    transition:opacity .34s ease, transform .34s ease;
  }
  .interject.shown{opacity:1;transform:none}

  .interject.alice{
    border-color:#17f0f1;
    background:rgba(11,124,255,.14);
    color:#9df7f9;
    text-shadow:0 0 18px rgba(23,240,241,.4);
  }

  h1,h2{
    font-family:var(--display);
    font-weight:700;
    letter-spacing:.06em;
    text-wrap:balance;
    margin:0;
  }
  h1{
    font-size:clamp(25px,5.2vw,37px);
    line-height:1.15;
    color:var(--gold);
    text-transform:uppercase;
    overflow-wrap:break-word;      
    hyphens:auto;
  }

  .rule{
    height:1px;
    background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);
    margin:18px 0 24px;
  }

  .lede{
    color:var(--muted);
    margin:0 0 30px;
    max-width:54ch;
  }

  button{
    font:inherit;
    color:inherit;
    background:none;
    border:none;
    cursor:pointer;
    -webkit-user-select:none;
    user-select:none;
  }

  #s-quiz, #s-age, #s-check{
    -webkit-user-select:none;
    user-select:none;
  }

  img, svg{
    -webkit-user-select:none;
    user-select:none;
    -webkit-user-drag:none;
  }
  img{
    pointer-events:none;         
  }
  .alice-full img{pointer-events:auto}
  :focus-visible{outline:2px solid var(--gold);outline-offset:3px}

  .btn{
    font-family:var(--display);
    font-weight:700;
    font-size:14px;
    letter-spacing:.14em;
    text-transform:uppercase;
    padding:13px 30px;
    color:var(--ink);
    background:var(--gold);
    border:1px solid var(--gold);
    transition:background .14s,color .14s;
  }
  .btn:hover{background:transparent;color:var(--gold)}

  .btn-quiet{
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--muted);
    padding:9px 16px;
    border:1px solid var(--gold-faint);
    transition:color .14s,border-color .14s;
  }
  .btn-quiet:hover{color:var(--gold);border-color:var(--gold-dim)}

  .cog{
    position:absolute;
    top:12px;right:12px;
    width:34px;height:34px;
    display:grid;
    place-items:center;
    color:var(--gold-dim);
    z-index:3;
    transition:color .15s,transform .25s ease;
  }
  .cog:hover{color:var(--gold);transform:rotate(35deg)}
  .cog svg{width:19px;height:19px;display:block}

  .settings{
    position:absolute;
    top:52px;right:12px;
    width:250px;
    padding:18px;
    background:var(--ink);
    border:1px solid var(--gold-dim);
    z-index:4;
    display:none;
  }
  .settings.open{display:block}

  .settings h2{
    font-size:12px;
    letter-spacing:.2em;
    color:var(--muted);
    text-transform:uppercase;
    margin-bottom:16px;
  }

  .setting{margin-bottom:17px}
  .setting:last-child{margin-bottom:0}

  .setting-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    margin-bottom:7px;
  }
  .setting-name{
    font-size:12.5px;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--text);
  }
  .setting-value{
    font-size:11.5px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }

  .setting input[type=range]{
    width:100%;
    accent-color:var(--gold);
    background:transparent;
    cursor:pointer;
  }

  .toggle{
    width:100%;
    padding:7px 0;
    font-size:11.5px;
    letter-spacing:.12em;
    text-transform:uppercase;
    border:1px solid var(--gold-faint);
    color:var(--muted);
    transition:color .14s,border-color .14s,background .14s;
  }
  .toggle[aria-pressed="true"]{
    color:var(--ink);
    background:var(--gold);
    border-color:var(--gold);
  }

  .opening{
    display:flex;
    align-items:center;
    gap:clamp(18px,4vw,34px);
    flex-wrap:wrap;
  }
  .opening-crest{
    width:clamp(84px,17vw,122px);
    flex:none;
    filter:drop-shadow(0 0 16px rgba(192,69,159,.4));
  }
  .opening-copy{flex:1 1 260px;min-width:0}

  .standing{
    font-family:var(--display);
    font-size:clamp(19px,3.8vw,27px);
    font-weight:700;
    letter-spacing:.07em;
    text-transform:uppercase;
    color:var(--gold);
    text-align:center;
    margin:0 0 26px;
    padding-bottom:20px;
    border-bottom:1px solid var(--gold-faint);
  }

  .progress{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:26px;
  }
  .pips{display:flex;gap:7px;flex-wrap:wrap}
  .pips[hidden]{display:none}

  .meter{flex:1;height:3px;background:var(--gold-faint)}
  .meter[hidden]{display:none}
  .meter-fill{
    display:block;                 
    height:100%;
    width:0;
    background:var(--gold);
    transition:width .25s ease;
  }
  .pip{
    width:9px;height:9px;
    transform:rotate(45deg);
    border:1px solid var(--gold-dim);
    transition:background .18s,border-color .18s;
  }
  .pip.done{background:var(--gold-dim);border-color:var(--gold-dim)}
  .pip.here{background:var(--gold);border-color:var(--gold)}

  .count{
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
    margin-left:auto;
  }

  .statement{
    font-family:var(--display);
    font-size:clamp(19px,3.5vw,26px);
    font-weight:500;
    line-height:1.42;
    letter-spacing:.01em;
    text-wrap:balance;
    margin:0 0 8px;
    min-height:2.9em;
    color:var(--text);
  }

  .scale{
    position:relative;
    padding-top:76px;
    margin-bottom:28px;
  }

  .steps{
    position:relative;
    display:flex;
    gap:2px;
  }
  .steps::before{
    content:"";
    position:absolute;
    top:7px;left:10%;right:10%;
    height:1px;
    background:var(--gold-faint);
  }

  .step{
    flex:1 1 0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    padding:0 2px 6px;
  }

  .node{
    width:15px;height:15px;
    transform:rotate(45deg);
    border:1px solid var(--gold-dim);
    background:var(--ink);
    transition:background .12s,border-color .12s,box-shadow .12s;
    position:relative;
    z-index:1;
  }
  .step.on .node{
    border-color:var(--gold);
    background:var(--gold);
    box-shadow:0 0 10px rgba(242,167,59,.55);
  }
  .step.picked .node{background:var(--orchid);border-color:var(--orchid)}

  .step-label{
    font-size:11.5px;
    line-height:1.35;
    letter-spacing:.02em;
    color:var(--muted);
    text-align:center;
    transition:color .12s;
  }
  .step.on .step-label{color:var(--gold)}

  .selector{
    position:absolute;
    top:0;left:0;
    width:46px;height:57px;
    pointer-events:none;
    transition:none;                  
  }
  .selector-art{
    position:relative;
    display:block;width:100%;height:100%;
    transform-origin:50% 72%;
    filter:drop-shadow(0 0 8px rgba(192,69,159,.55));
  }
  .selector-art img,
  .selector-art svg{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:contain;
    display:block;
  }
  .selector-art [hidden]{display:none !important}

  .selector-art.wind{animation:wind var(--wind) ease-in forwards}
  .selector-art.land{animation:land 150ms cubic-bezier(.2,1.7,.4,1)}

  @keyframes wind{
    from{transform:scale(1) translateY(0)}
    to  {transform:scale(.58) translateY(7px)}
  }
  @keyframes land{
    0%  {transform:scale(.58) translateY(7px)}
    52% {transform:scale(1.2) translateY(-3px)}
    100%{transform:scale(1) translateY(0)}
  }

  .footer{display:flex;align-items:center;gap:12px}
  #forward{margin-left:auto}

  #s-age,
  #s-check{
    --gold:#8d7a9c;
    --gold-dim:#675972;
    --gold-faint:rgba(103,89,114,.38);
  }

  /* ---------------- the credits ----------------
     Along the foot of the window, out of the way, and gone whenever the
     plate is taken over - she does not share the screen. */

  .credits-btn{
    display:block;
    margin:28px auto 34px;
    padding:7px 18px;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    border:1px solid var(--gold-faint);
    background:rgba(0,0,0,.6);
    transition:color .14s,border-color .14s,opacity .45s ease;
  }
  .credits-btn:hover{color:var(--gold);border-color:var(--gold-dim)}

  .plate.hers ~ .credits-btn,
  .plate.taken ~ .credits-btn,
  .plate.solo ~ .credits-btn{
    opacity:0;
    pointer-events:none;
  }

  .credits-panel{
    position:fixed;
    inset:0;
    z-index:80;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.86);
    opacity:0;
    transition:opacity .3s ease;
  }
  .credits-panel.on{opacity:1}
  .credits-panel[hidden]{display:none}

  .credits-sheet{
    position:relative;
    width:100%;
    max-width:560px;
    padding:clamp(26px,5vw,42px);
    border:1px solid var(--gold-dim);
    background:var(--ink);
    text-align:center;
  }
  .credits-sheet::before{
    content:"";
    position:absolute;
    inset:6px;
    border:1px solid var(--gold-faint);
    pointer-events:none;
  }
  .credits-sheet h2{
    font-family:var(--display);
    font-size:clamp(18px,3vw,23px);
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 18px;
  }
  .credits-sheet .btn-quiet{margin-top:20px}

  .credits{
    font-family:Karla,"Segoe UI",system-ui,sans-serif;
    font-size:13px;
    line-height:1.6;
    color:var(--muted);
  }

  .credits-row + .credits-row{
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid var(--gold-faint);
  }
  .credits-row span{display:block}
  .credits-row span + span{margin-top:5px}

  .credits b{
    font-weight:600;
    color:#9a8aa0;
    letter-spacing:.02em;
  }
  .credits a{
    color:#8a7a92;
    text-decoration:none;
    border-bottom:1px solid rgba(154,138,160,.3);
  }
  .credits a:hover{color:var(--gold);border-bottom-color:var(--gold)}
  .credits a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  @media (max-width:640px){
    .credits{font-size:12px}
    .credits-btn{margin:22px auto 26px}
  }

  .challenge{
    min-height:clamp(140px,26vh,200px);
    display:flex;
    align-items:center;
  }
  .challenge-q{
    width:100%;
    font-family:var(--display);
    font-size:clamp(18px,3.2vw,25px);
    font-weight:500;
    line-height:1.5;
    color:#b9a6c9;
    text-wrap:balance;
    margin:0;
    padding:clamp(18px,3vw,26px);
    border:1px solid #675972;
    background:rgba(69,50,76,.32);
  }
  .challenge-row{display:flex;gap:12px;margin-top:20px}
  .challenge-row[hidden]{display:none}
  .challenge-q[hidden]{display:none}

  #s-alice .challenge-q{
    text-wrap:wrap;
    white-space:normal;
  }

  .alice-row{justify-content:space-between;gap:16px}
  .alice-row .btn,
  .alice-row .btn-quiet{
    flex:1 1 0;
    min-width:0;
    max-width:200px;
    text-align:center;
    font-family:var(--display);
    font-weight:700;
    font-size:14px;
    letter-spacing:.14em;
    text-transform:uppercase;
    padding:13px 0;
  }

  #s-alice{
    --gold:#17f0f1;
    --gold-dim:#0b7cff;
    --gold-faint:rgba(23,240,241,.22);
  }
  #s-alice .challenge-q{
    color:#9df7f9;
    text-shadow:0 0 18px rgba(23,240,241,.35);
  }

  .alice-form{
    position:absolute;
    bottom:100%;
    left:50%;
    transform:translateX(-50%);
    height:clamp(150px,26vh,255px);
    width:auto;
    max-width:92%;
    aspect-ratio:352 / 455;
    pointer-events:none;
  }
  .alice-form[hidden]{display:none}
  .alice-form img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    opacity:0;
    transition:opacity .9s ease;
  }
  .alice-form img.on{opacity:1}

  .af-face{
    filter:drop-shadow(0 0 26px rgba(23,240,241,.5))
           drop-shadow(0 0 54px rgba(11,124,255,.32));
    transition:opacity .9s ease, transform .9s ease, filter 1s ease;
  }
  .alice-form.gone .af-face{
    filter:drop-shadow(0 0 0 rgba(23,240,241,0))
           drop-shadow(0 0 0 rgba(11,124,255,0));
  }

  .alice-mark{
    color:#17f0f1 !important;
    cursor:pointer;
    text-shadow:0 0 12px rgba(23,240,241,.75), 0 0 26px rgba(11,124,255,.45);
    animation:alice-mark-pulse 2.4s ease-in-out infinite;
  }
  @keyframes alice-mark-pulse{
    0%,100%{text-shadow:0 0 10px rgba(23,240,241,.6),  0 0 22px rgba(11,124,255,.35)}
    50%    {text-shadow:0 0 18px rgba(23,240,241,.95), 0 0 38px rgba(11,124,255,.6)}
  }
  .alice-mark.spent{
    animation:none;
    cursor:default;
    text-shadow:none;
  }
  @media (prefers-reduced-motion:reduce){ .alice-mark{animation:none} }

  .alice-full{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    padding-right:clamp(0px,1.5vw,28px);
    background:transparent;
    z-index:70;
    opacity:0;
    pointer-events:none;
    transition:opacity .7s ease;
  }
  .alice-full.on{opacity:1}
  .alice-full[hidden]{display:none}
  .alice-full img{
    width:auto;
    height:auto;
    max-height:min(455px, 80vh);
    max-width:min(352px, 82vw);
    filter:drop-shadow(0 0 50px rgba(23,240,241,.5))
           drop-shadow(0 0 110px rgba(11,124,255,.3));
  }

  .blackout{
    position:fixed;
    inset:0;
    background:#000;
    opacity:0;
    pointer-events:none;
    z-index:60;
    transition:opacity .65s ease;
  }
  .blackout.on{opacity:1}
  .blackout[hidden]{display:none}

  .af-face, .af-hand{
    transform:translateY(14px) scale(.97);
    transition:opacity .9s ease, transform .9s ease;
  }
  .alice-form.forward .af-face,
  .alice-form.forward .af-hand{transform:none}

  .alice-form.falling .af-hand{
    opacity:0;
    transform:translateY(26px) scale(.95);
    transition:opacity .5s ease, transform .5s ease;
  }
  .alice-form.gone img{
    opacity:0;
    transform:translateY(30px) scale(.94);
    transition:opacity .75s ease, transform .75s ease;
  }

  .af-flame{
    transform:translate(4.34%, -3.3%);
    clip-path:inset(0 0 0 0);
    animation:alice-flicker 2.1s ease-in-out infinite;
  }
  @keyframes alice-flicker{
    0%   {filter:drop-shadow(0 0 13px rgba(23,240,241,.5))  brightness(1)}
    18%  {filter:drop-shadow(0 0 26px rgba(23,240,241,.85)) brightness(1.13)}
    34%  {filter:drop-shadow(0 0 16px rgba(11,124,255,.6))  brightness(.96)}
    52%  {filter:drop-shadow(0 0 30px rgba(23,240,241,.9))  brightness(1.16)}
    71%  {filter:drop-shadow(0 0 15px rgba(23,240,241,.55)) brightness(1)}
    88%  {filter:drop-shadow(0 0 23px rgba(11,124,255,.75)) brightness(1.08)}
    100% {filter:drop-shadow(0 0 13px rgba(23,240,241,.5))  brightness(1)}
  }
  .alice-form.guttering .af-flame{
    animation:none;
    opacity:0;
    transform:translate(4.34%, -3.3%) scale(.88);
    transition:opacity 1.6s ease-in, transform 1.6s ease-in;
  }

  .alice-form.snuffed .af-flame{
    animation:none;
    clip-path:inset(100% 0 0 0);
    opacity:0;
    transition:clip-path .11s linear, opacity .01s linear .11s;
  }
  @media (prefers-reduced-motion:reduce){
    .af-flame{animation:none}
    .alice-form img{transition:none}
  }

  .alice-reply{
    width:100%;
    margin:0;
    padding:clamp(16px,3vw,24px) clamp(20px,4vw,34px);
    border:1px solid #17f0f1;
    background:rgba(11,124,255,.14);
    text-align:center;
    min-height:1px;
  }
  .alice-reply[hidden]{display:none}
  .alice-reply p{
    margin:0 0 .5em;
    color:#9df7f9;
    font-family:var(--display);
    font-size:clamp(16px,2.9vw,22px);
    line-height:1.5;
    text-wrap:balance;
    text-shadow:0 0 18px rgba(23,240,241,.35);
  }
  .alice-reply p:last-child{margin-bottom:0}
  .challenge-q.typing::after,
  .alice-reply p.typing::after{
    content:"";
    display:inline-block;
    width:.5ch;
    height:1em;
    margin-left:.1em;
    background:#17f0f1;
    vertical-align:-.13em;
    animation:alice-caret .8s steps(1) infinite;
  }
  @keyframes alice-caret{0%,49%{opacity:1}50%,100%{opacity:0}}

  .verdict{display:flex;gap:clamp(18px,4vw,32px);align-items:center;flex-wrap:wrap}

  .verdict-art{
    width:auto;height:auto;
    max-width:clamp(150px,36vw,250px);
    max-height:170px;
    object-fit:contain;
    flex:none;
  }
  .verdict-art[hidden]{display:none}
  .verdict-copy{flex:1 1 240px;min-width:0}

  .eyebrow{
    font-size:11.5px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 9px;
  }

  .prose p{
    color:var(--muted);
    margin:0 0 1.15em;
    max-width:62ch;
  }
  .prose{margin-top:26px}

  .prose strong, .verdict strong, .folly strong{
    font-weight:600;
    color:var(--gold);
    letter-spacing:.01em;
  }

  .folly{
    margin:30px 0;
    padding:22px 24px;
    border:1px solid var(--gold-faint);
    border-left:2px solid var(--gold);
  }
  .folly-lead{
    font-size:13.5px;
    color:var(--muted);
    margin:0 0 12px;
  }
  .folly-q{
    font-family:var(--display);
    font-size:clamp(17px,3vw,21px);
    line-height:1.45;
    color:var(--gold);
    margin:0;
    text-wrap:balance;
  }

  .shadow{
    margin-top:36px;
    padding-top:26px;
    border-top:1px solid var(--gold-faint);
  }
  .shadow h2{
    font-size:clamp(19px,3.4vw,25px);
    color:var(--gold);
    text-transform:uppercase;
    margin-bottom:18px;
  }
  .shadow p:last-child{color:var(--text)}

  .tally{margin:34px 0 28px}
  .tally-row{
    display:grid;
    grid-template-columns:26px minmax(104px,1.5fr) 1fr auto;
    align-items:center;
    gap:11px;
    padding:6px 0;
    font-size:13px;
    color:var(--muted);
    border-bottom:1px solid var(--gold-faint);
  }
  .tally-icon{
    width:26px;height:26px;
    display:grid;place-items:center;
  }
  .tally-icon img{
    max-width:100%;max-height:100%;
    object-fit:contain;
    display:block;
  }
  .tally-name{
    font-family:var(--display);
    letter-spacing:.03em;
    font-size:12.5px;
    min-width:0;
    overflow-wrap:anywhere;
  }
  .tally-track{height:3px;background:var(--gold-faint)}
  .tally-fill{display:block;height:100%;width:0;background:var(--gold-dim)}
  .tally-pct{font-variant-numeric:tabular-nums;font-size:12px}
  .tally-row.top{color:var(--text)}
  .tally-row.top .tally-name{font-weight:700}

  .others{
    margin-top:36px;
    padding-top:26px;
    border-top:1px solid var(--gold-faint);
  }
  .others[hidden]{display:none}

  #discarded{
    border-top:none;
    padding-top:0;
    margin-top:30px;
  }
  #discarded:not([hidden]) + .result-actions{
    border-top:none;
    padding-top:0;
  }
  .others h3{
    font-family:var(--display);
    font-size:clamp(14px,2.4vw,17px);
    font-weight:700;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 14px;
  }
  .gap-note{
    color:var(--muted);
    font-size:14px;
    margin:0 0 22px;
    max-width:60ch;
  }

  .result-actions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    margin-top:36px;
    padding-top:24px;
    border-top:1px solid var(--gold-faint);
  }

  .btn-dark{
    font-family:var(--display);
    font-size:11.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    padding:9px 18px;
    color:#6b626e;
    background:#090909;
    border:1px solid #241f26;
    margin-left:auto;
    transition:color .14s,border-color .14s;
  }
  .btn-dark:hover{color:var(--text);border-color:#4a434c}

  .vessel-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:14px;
    margin-top:22px;
  }

  .vessel-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:11px;
    padding:18px 12px 15px;
    background:transparent;
    border:1px solid rgba(255,255,255,.5);
    color:inherit;
    font:inherit;
    text-align:center;
    cursor:pointer;
    transition:border-color .14s,background .14s,transform .14s;
  }
  .vessel-card:hover,
  .vessel-card:focus-visible{
    border-color:#fff;
    background:rgba(255,255,255,.05);
    transform:translateY(-2px);
  }
  .vessel-card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  .vessel-card img{
    width:78px;
    height:78px;
    object-fit:contain;
    flex:none;
  }
  .vessel-card .vessel-name{
    font-family:var(--display);
    font-size:14px;
    letter-spacing:.045em;
    text-transform:uppercase;
    color:var(--gold);
    overflow-wrap:break-word;
    line-height:1.32;
  }

  .synergy{
    display:flex;
    align-items:center;
    gap:10px;
    margin:0 0 10px;
    max-width:320px;
  }
  .synergy-track{
    flex:1 1 auto;
    height:3px;
    background:var(--gold-faint);
  }
  .synergy-fill{
    display:block;
    height:100%;
    width:0;
    background:var(--gold-dim);
  }
  .synergy-pct{
    font-variant-numeric:tabular-nums;
    font-size:12px;
    color:var(--gold);
  }

  .answer-row{
    display:grid;
    grid-template-columns:30px 1fr auto;
    gap:12px;
    align-items:baseline;
    padding:10px 0;
    border-bottom:1px solid var(--gold-faint);
  }
  .answer-n{
    color:var(--muted);
    font-size:12px;
    font-variant-numeric:tabular-nums;
  }
  .answer-q{color:var(--text);font-size:14px;min-width:0}
  .answer-a{
    color:var(--gold);
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    text-align:right;
  }

  @media (prefers-reduced-motion:reduce){
    .selector-art.wind,.selector-art.land{animation:none}
    *{transition-duration:.01ms !important}
  }

  @media (max-width:560px){
    .scale{padding-top:0;padding-left:54px}
    .steps{flex-direction:column;gap:7px}
    .steps::before{display:none}
    .step{
      flex-direction:row;
      justify-content:flex-start;
      gap:14px;
      padding:11px 14px;
      border:1px solid var(--gold-faint);
    }
    .step.on{border-color:var(--gold-dim)}
    .step-label{font-size:14px;text-align:left}
    .selector{width:40px;height:50px}
    .answer-row{grid-template-columns:24px 1fr;gap:8px}
    .answer-a{grid-column:2;text-align:left;margin-top:2px}
    .btn-dark{margin-left:0;width:100%;text-align:center}
    .vessel img{width:58px;max-height:58px}
    .tally-row{grid-template-columns:24px 1fr auto;gap:9px}
    .tally-icon{width:24px;height:24px}
    .tally-track{display:none}
    .settings{width:calc(100% - 24px)}
  }
</style>
</head>
<body>

<div id="quizBackground"></div>

<!-- Outside .wrap on purpose. The plate has a perspective set on it, which
     makes it the containing block for anything fixed inside it - these have
     to hang off the window itself, not off the page. -->
<div class="blackout" id="blackout" hidden></div>
<div class="alice-full" id="alice-full" hidden><img id="alice-full-art" alt=""></div>

<div class="wrap">
  <div class="plate">

    <!-- ===================== SETTINGS ===================== -->
    <button class="cog" id="cog" aria-label="Settings" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">

/* ---- running a quiz ---- */
function makeOrder(){
  const loose = [], pinned = new Map();

  QUESTIONS.forEach((q, i) => {
    if (q.pin && q.pin >= 1 && q.pin <= QUESTIONS.length) pinned.set(q.pin - 1, i);
    else loose.push(i);
  });

  if (SHUFFLE){
    for (let i = loose.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      const t = loose[i]; loose[i] = loose[j]; loose[j] = t;
    }
  }

  const out = [];
  let next = 0;
  for (let slot = 0; slot < QUESTIONS.length; slot++){
    out.push(pinned.has(slot) ? pinned.get(slot) : loose[next++]);
  }
  return out;
}

function qAt(i){ return QUESTIONS[order[i]]; }

function pickAlice(){
  if (!(Math.random() < ALICE_CHANCE)) return -1;
  const first = Math.max(0, ALICE_FROM - 1);
  const last = Math.min(ALICE_TO - 1, order.length - 1);
  const span = last - first + 1;
  if (span <= 0 || !ALICE_LINE) return -1;

  for (let tries = 0; tries < 12; tries++){
    const slot = first + Math.floor(Math.random() * span);
    if (!qAt(slot).solo) return slot;
  }
  return -1;
}

function pickInterjection(){
  const span = order.length - INTERJECT_AFTER;
  if (span <= 0 || !INTERJECTIONS.length) return -1;

  for (let tries = 0; tries < 12; tries++){
    const slot = INTERJECT_AFTER + Math.floor(Math.random() * span);
    if (!qAt(slot).solo) return slot;
  }
  return -1;
}

      if (!face.classList.contains("on") || src.indexOf(ALICE_ART.closed) !== -1){

      aliceBlinkTimer = setTimeout(() => {

function aliceVoiceFor(text){
  const n = (text || "").length;
  if (n <= ALICE_VOICE_SHORT) return aliceVoices.short;
  if (n >= ALICE_VOICE_LONG) return aliceVoices.long;
  return aliceVoices.mid;
}

function aliceSpeakStart(text){
  aliceSpeakStop();
  aliceVoice = aliceVoiceFor(text);
  if (!aliceVoice) return;
  if (settings.sound <= 0) return;

  try{
    aliceVoice.muted = false;
    aliceVoice.volume = Math.max(0, Math.min(1, (settings.sound / 100) * ALICE_VOICE_GAIN));
    aliceVoice.currentTime = 0;
    const p = aliceVoice.play();
    if (p && p.catch) p.catch(() => {});
  }catch(e){}
}

function aliceSpeakPause(){
  if (!aliceVoice) return;
  try{ aliceVoice.muted = true; }catch(e){}
}

function aliceSpeakResume(){
  if (!aliceVoice) return;
  try{ aliceVoice.muted = false; }catch(e){}
}

function aliceSpeakStop(){
  for (const key in aliceVoices){
    const a = aliceVoices[key];
    try{
      a.pause();
      a.currentTime = 0;
      a.muted = false;
    }catch(e){}
  }
}

function aliceTypeInto(el, text, done){
  el.textContent = "";
  el.classList.add("typing");
  aliceSpeakStart(text);

  let over = false;
  const settle = hurried => {
    if (over) return;
    over = true;
    clearTimeout(aliceTimer);
    aliceSkip = null;
    el.textContent = text;
    el.classList.remove("typing");

    aliceSpeakStop();

    if (done) done();
  };

  aliceSkip = () => settle(true);

  let i = 0;
  const step = () => {
    i++;
    el.textContent = text.slice(0, i);
    if (i >= text.length){ settle(false); return; }

    const ch = text.charAt(i - 1);

    let breath = 0;
    if (/[.!?\u2026]/.test(ch)) breath = ALICE_PAUSE;
    else if (/[,;:]/.test(ch)) breath = ALICE_PAUSE * 0.4;

    if (breath){
      aliceSpeakPause();
      aliceTimer = setTimeout(() => {
        aliceSpeakResume();
        step();
      }, ALICE_TYPE + breath);
      return;
    }

    aliceTimer = setTimeout(step, ALICE_TYPE);
  };
  aliceTimer = setTimeout(step, ALICE_TYPE);
  return el;
}

function aliceType(box, text, done){
  const p = document.createElement("p");
  box.appendChild(p);
  return aliceTypeInto(p, text, done);
}

        fadeInMusic(1600);

        black.classList.remove("on");
        setTimeout(() => { black.hidden = true; }, 700);

    }, 620);
  };

  const comeForward = () => {
    art.hand.src = asset(ALICE_ART.hand);
    art.face.src = asset(ALICE_ART.closed);
    requestAnimationFrame(() => {
      art.hand.classList.add("on");
      art.form.classList.add("forward");
    });

    clearTimeout(aliceFaceTimer);
    aliceFaceTimer = setTimeout(() => {
      art.face.classList.add("on");
      aliceFaceTimer = setTimeout(() => {
        art.face.src = asset(ALICE_ART.open);
        aliceBlinkStart();
      }, 1050);
    }, 700);
  };

  const cutFlame = () => {
    art.form.classList.add("snuffed");
  };

  const partWell = () => {
    aliceAnswer = null;
    aliceClose = null;
    row.hidden = true;
    box.hidden = true;
    reply.hidden = false;

    art.form.classList.add("snuffed");
    art.form.classList.add("falling");

    aliceBlessed = true;
    aliceTimer = setTimeout(() => {
      aliceType(reply, ALICE_GUIDES, () => {
        aliceTimer = setTimeout(() => {
          art.face.src = asset(ALICE_ART.closed);
          aliceTimer = setTimeout(finish, 850);
        }, 800);
      });
    }, 700);
  };

  const ask = () => {
    reply.hidden = true;
    reply.textContent = "";
    box.hidden = false;
    row.hidden = true;

    aliceTypeInto(box, ALICE_ASKS[step], () => {
      row.hidden = false;
      aliceAnswer = answer;
      aliceBlinkStart();
    });
  };

  const answer = yes => {
    aliceAnswer = null;
    aliceBlinkStop();
    row.hidden = true;
    box.hidden = true;
    reply.hidden = false;
    reply.textContent = "";

    if (yes){
      aliceType(reply, ALICE_LIKES[step] || ALICE_LIKES[ALICE_LIKES.length - 1], () => {
        aliceTimer = setTimeout(() => {
          step++;
          if (step >= ALICE_ASKS.length){ partWell(); return; }
          ask();
          if (step === 1) comeForward();
          if (step === 2) cutFlame();
        }, 1500);
      });
      aliceClose = null;
      return;
    }

    art.form.classList.add(step === 0 ? "guttering" : "snuffed");
    fadeOutMusic(3000);
    aliceTimer = setTimeout(() => {
      art.form.classList.add("falling");
      if (art.face.getAttribute("src")) art.face.src = asset(ALICE_ART.closed);

      aliceType(reply, ALICE_DISLIKES[line], () => {
        line++;

        if (line < ALICE_DISLIKES.length){
          aliceTimer = setTimeout(speak, 520);

        aliceTimer = setTimeout(() => {
          reply.textContent = "";
          aliceType(reply, ALICE_FAREWELL, () => {
            aliceTimer = setTimeout(finish, 1500);
          });
        }, 900);
      });
    };
    speak();
  };

  aliceClose = null;
  aliceTimer = setTimeout(() => {
    art.form.hidden = false;
    art.flame.src = asset(ALICE_ART.flame);
    requestAnimationFrame(() => art.flame.classList.add("on"));

    aliceTimer = setTimeout(() => {
      useMusic(ALICE_MUSIC);
      fadeInMusic(2600);
      ask();
    }, 1000);
  }, 750);
}

function interject(done, who){
  who = who || QUEEN_ASIDE;

  const box = $("interject");
  box.textContent = who.lines[Math.floor(Math.random() * who.lines.length)];
  box.classList.remove("shown");
  box.classList.toggle("alice", !!who.alice);

  show("aside");

  const omen = $("omen");
  if (omen && who.omen){
    clearTimeout(omenTimer);
    omenTimer = null;
    omen.classList.remove("fading");
    omen.style.removeProperty("animation-duration");
    omen.classList.toggle("omen-alice", !!who.alice);
    omen.hidden = false;
    omen.src = asset(who.omen);
  }

  void box.offsetWidth;
  box.classList.add("shown");

  let over = false;
  const close = () => {
    if (over) return;
    over = true;
    asideClose = null;
    clearTimeout(timer);
    box.classList.remove("shown");

    const omen = $("omen");
    if (omen && !omen.hidden){
      omen.classList.remove("fading");
      void omen.offsetWidth;

      if (!who.alice) omen.style.animationDuration = "300ms";
      omen.classList.add("fading");
      clearTimeout(omenTimer);
      omenTimer = setTimeout(hideOmen, who.alice ? 260 : 320);
    }

    setTimeout(() => {
      show("quiz");
      try { done(); } catch (e){ release(); render(); }
    }, 340);
  };

  asideClose = close;
  const timer = setTimeout(close, 2600);
  screens.aside.addEventListener("click", close, { once: true });
}

function scaleOf(q){ return SCALES[q.scale || DEFAULT_SCALE]; }
function middleOf(q){ return Math.floor(scaleOf(q).length / 2); }

const SERVED = location.protocol === "http:" || location.protocol === "https:";
const ASSETS = "assets/";

function asset(name){
  const p = ASSETS + name;
  return SERVED ? p + "?v=" + ASSET_VERSION : p;
}

function hexParts(hex){
  const h = hex.replace("#", "");
  const n = h.length === 3 ? h.split("").map(c => c + c).join("") : h;
  return [0, 2, 4].map(i => parseInt(n.slice(i, i + 2), 16));
}

function useAccent(hex){

  const [r, g, b] = hexParts(hex);

  root.style.setProperty("--gold-dim",
    "rgb(" + Math.round(r * .72) + "," + Math.round(g * .72) + "," + Math.round(b * .72) + ")");
  root.style.setProperty("--gold-faint", "rgba(" + r + "," + g + "," + b + ",.34)");
}

function unrollResult(){
  const parts = screens.result.querySelectorAll(
    ".verdict, .prose, #verdict-folly, #verdict-shadow, #others, .result-actions"
  );

  const still = window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  if (still || !("IntersectionObserver" in window)){
    parts.forEach(el => el.classList.remove("unroll", "unrolled"));
    return;
  }

  parts.forEach(el => { el.classList.add("unroll"); el.classList.remove("unrolled"); });

  const watcher = new IntersectionObserver((seen, self) => {
    seen.forEach(entry => {
      if (!entry.isIntersecting) return;
      entry.target.classList.add("unrolled");
      self.unobserve(entry.target);
    });
  }, { rootMargin: "0px 0px 40% 0px", threshold: 0 });

  parts.forEach(el => watcher.observe(el));
}

let musicWanted = true;

const MUSIC_KEY = "ash-queen-music";
let spotSavedAt = 0;

function saveSpot(){
  if (!music && !seamOn) return;
  try{
    localStorage.setItem(MUSIC_KEY, JSON.stringify({
      track: currentTrack,

let seamOn = false;
let actx = null;
let musicGain = null;
let srcNode = null;
const decoded = {};
const seamBad = {};
let elementTrack = null;
let seamWant = null;
let seamAt = 0;
let seamTrack = null;
let seamLoop = null;
let seamStartedAt = 0;
let seamOffset = 0;

function audioContextClass(){
  return window.AudioContext || window.webkitAudioContext || null;
}

function canSeam(){
  const p = location.protocol;
  return !!audioContextClass() && (p === "http:" || p === "https:");
}

function soundBounds(buf){
  const quiet = 0.0008;
  const chans = [];
  for (let c = 0; c < buf.numberOfChannels; c++) chans.push(buf.getChannelData(c));
  const n = buf.length;

  let first = 0;
  head: for (; first < n; first++)
    for (let c = 0; c < chans.length; c++)
      if (Math.abs(chans[c][first]) > quiet) break head;

  let last = n - 1;
  tail: for (; last > first; last--)
    for (let c = 0; c < chans.length; c++)
      if (Math.abs(chans[c][last]) > quiet) break tail;

  if (first >= last) return { start: 0, end: buf.duration };
  return { start: first / buf.sampleRate, end: (last + 1) / buf.sampleRate };
}

function loadTrack(track){
  if (decoded[track]) return Promise.resolve(decoded[track]);
  return fetch(asset(track))
    .then(r => r.ok ? r.arrayBuffer() : Promise.reject(new Error("unreadable")))
    .then(bytes => new Promise((ok, no) => {
      const p = actx.decodeAudioData(bytes, ok, no);
      if (p && p.then) p.then(ok, no);
    }))
    .then(buf => { decoded[track] = buf; return buf; });
}

function seamStop(){
  if (srcNode){
    try{ srcNode.stop(); }catch(e){}
    try{ srcNode.disconnect(); }catch(e){}
  }
  srcNode = null;
  seamTrack = null;
}

function seamPlay(track, offset){
  const buf = decoded[track];
  if (!buf) return;
  seamStop();

  const set = MUSIC_LOOP[track] || {};
  const found = soundBounds(buf);
  const start = set.start ? set.start : found.start;
  const end = set.end ? set.end : found.end;
  const span = Math.max(0.05, end - start);

  let at = start + (((offset || 0) - start) % span);
  if (!isFinite(at) || at < start) at = start;

  srcNode = actx.createBufferSource();
  srcNode.buffer = buf;
  srcNode.loop = true;
  srcNode.loopStart = start;
  srcNode.loopEnd = end;
  srcNode.connect(musicGain);
  srcNode.start(0, at);

  seamTrack = track;
  seamLoop = { start: start, end: end };
  seamStartedAt = actx.currentTime;
  seamOffset = at;
}

function seamPosition(){
  if (!srcNode || !seamLoop) return seamAt;
  const span = Math.max(0.05, seamLoop.end - seamLoop.start);
  const gone = actx.currentTime - seamStartedAt;
  return seamLoop.start + ((seamOffset - seamLoop.start + gone) % span);
}

function seamEnsure(){
  if (!seamOn) return false;

  if (!seamWant || settings.music <= 0 || !musicWanted){ seamStop(); return true; }
  if (actx.state === "suspended") actx.resume().catch(() => {});
  if (srcNode && seamTrack === seamWant) return true;

  const track = seamWant;
  loadTrack(track).then(() => {
    if (seamWant !== track || settings.music <= 0 || !musicWanted) return;
    if (srcNode && seamTrack === track) return;
    seamPlay(track, seamAt);
  }).catch(() => {
    seamBad[track] = true;
    if (seamWant === track){ seamStop(); applyMusic(); }
  });
  return true;
}

function seekTo(seconds){
  if (seamOn){ seamAt = Math.max(0, seconds || 0); return; }
  if (!music || !isFinite(seconds) || seconds <= 0) return;
  const go = () => { try{ music.currentTime = seconds; }catch(e){} };
  if (music.readyState >= 1) go();
  else music.addEventListener("loadedmetadata", go, { once: true });
}

/* ---- audio ---- */
function initAudio(){
  for (let i = 0; i < 4; i++){
    const a = new Audio(asset(SOUND_HOVER));
    a.preload = "auto";
    hoverPool.push(a);
  }

  if (canSeam()){
    try{
      actx = new (audioContextClass())();
      musicGain = actx.createGain();
      musicGain.gain.value = 0;
      musicGain.connect(actx.destination);
      seamOn = true;
      seamWant = currentTrack;
      setInterval(() => { if (srcNode) saveSpot(); }, 1000);
    }catch(e){ seamOn = false; }
  }

  music = new Audio();
  music.loop = true;
  music.preload = "auto";
  elementTrack = null;

  for (const key in ALICE_VOICE){
    const a = new Audio(asset(ALICE_VOICE[key]));
    a.loop = true;
    a.preload = "auto";
    aliceVoices[key] = a;
  }

  music.addEventListener("timeupdate", () => {
    const now = performance.now();
    if (now - spotSavedAt < 1000) return;
    spotSavedAt = now;
    saveSpot();
  });
  window.addEventListener("pagehide", saveSpot);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") saveSpot();
  });
}

function unlockAudio(){
  if (unlocked) return;
  unlocked = true;

  if (actx && actx.state === "suspended") actx.resume().catch(() => {});

  hoverPool.forEach(a => {
    a.volume = 0;
    const p = a.play();
    if (p && p.then) p.then(() => { a.pause(); a.currentTime = 0; }).catch(() => {});
  });
}

function playHover(){
  if (muteHover) return;
  if (settings.sound <= 0 || !hoverPool.length) return;

  const now = performance.now();
  if (now - lastHoverAt < 45) return;
  lastHoverAt = now;

  hoverNext = (hoverNext + 1) % hoverPool.length;
  const a = hoverPool[hoverNext];

  try{
    a.currentTime = 0;
    a.volume = settings.sound / 100;
    const p = a.play();
    if (p && p.catch) p.catch(() => {});
  }catch(e){}
}

function applyMusic(){
  const gain = TRACK_GAIN[currentTrack] || 1;
  const level = Math.max(0, Math.min(1, (settings.music / 100) * gain));

  if (seamOn && !seamBad[currentTrack]){
    if (music) music.pause();
    try{
      musicGain.gain.cancelScheduledValues(actx.currentTime);
      musicGain.gain.value = level;
    }catch(e){}
    seamEnsure();
    return;
  }

  if (!music) return;
  if (seamOn) seamStop();

  if (!currentTrack){ music.pause(); return; }
  if (elementTrack !== currentTrack){
    elementTrack = currentTrack;
    music.src = asset(currentTrack);
    music.currentTime = 0;
    if (seamAt > 0){
      const at = seamAt;
      const go = () => { try{ music.currentTime = at; }catch(e){} };
      if (music.readyState >= 1) go();
      else music.addEventListener("loadedmetadata", go, { once: true });
    }
  }

  music.volume = level;
  if (settings.music > 0 && musicWanted) music.play().catch(() => {});
  else music.pause();
}

let fadeTimer = null;

function fadeOutMusic(ms){
  clearInterval(fadeTimer);
  fadeTimer = null;
  musicWanted = false;

  if (seamOn){
    try{
      const now = actx.currentTime;
      musicGain.gain.cancelScheduledValues(now);
      musicGain.gain.setValueAtTime(musicGain.gain.value, now);
      musicGain.gain.linearRampToValueAtTime(0, now + Math.max(0.05, ms / 1000));
    }catch(e){}
    setTimeout(() => { if (!musicWanted) seamStop(); }, ms + 80);
    return;
  }

  if (!music) return;
  const from = music.volume;
  const steps = 32;
  let step = 0;

  fadeTimer = setInterval(() => {
    step += 1;
    music.volume = Math.max(0, from * (1 - step / steps));
    if (step >= steps){
      clearInterval(fadeTimer);
      fadeTimer = null;
      music.pause();
      music.volume = from;
    }
  }, Math.max(16, ms / steps));
}

function fadeInMusic(ms){
  clearInterval(fadeTimer);
  fadeTimer = null;
  musicWanted = true;

  const gain = TRACK_GAIN[currentTrack] || 1;
  const level = Math.max(0, Math.min(1, (settings.music / 100) * gain));

  if (seamOn && musicGain){
    try{
      const now = actx.currentTime;
      musicGain.gain.cancelScheduledValues(now);
      musicGain.gain.setValueAtTime(0, now);
      musicGain.gain.linearRampToValueAtTime(level, now + Math.max(0.05, ms / 1000));
    }catch(e){}
    seamEnsure();
    return;
  }

  if (!music) return;
  music.volume = 0;
  if (settings.music > 0) music.play().catch(() => {});

  const steps = 32;
  let step = 0;
  fadeTimer = setInterval(() => {
    step += 1;
    music.volume = Math.max(0, Math.min(level, level * (step / steps)));
    if (step >= steps){
      clearInterval(fadeTimer);
      fadeTimer = null;
      music.volume = level;
    }
  }, Math.max(16, ms / steps));
}

function useMusic(track){
  musicWanted = true;
  clearInterval(fadeTimer);
  fadeTimer = null;

  const want = track || MUSIC_TRACK;
  if (!want){ musicWanted = false; if (seamOn) seamStop(); if (music) music.pause(); return; }

  if (seamOn){
    if (want !== seamWant){
      seamStop();
      seamWant = want;
      seamAt = 0;
      currentTrack = want;
      saveSpot();
    }
    applyMusic();
    return;
  }

  if (!music) return;

  if (want === currentTrack){
    applyMusic();
    return;
  }

  currentTrack = want;
  music.pause();
  music.currentTime = 0;
  music.src = asset(want);
  elementTrack = want;
  seamAt = 0;
  saveSpot();
  applyMusic();
}

function render(){

  busyGuard = null;

  afterLanding = null;

  if (plateEl){

    else plateEl.style.removeProperty("--mood");
  }

  muteHover = !!item.mute;

  if (item.silent){
    musicWanted = false;
    if (seamOn) seamStop();
    if (music) music.pause();
  }else{
    musicWanted = true;
    applyMusic();
  }
  $("back").style.visibility = index === 0 ? "hidden" : "visible";
  $("forward").style.visibility =
    (picks[index] !== undefined && nextSlot() < order.length) ? "visible" : "hidden";

  const many = order.length > 12;
  const pips = $("pips");
  const meter = $("meter");
  pips.hidden = many;
  meter.hidden = !many;

  if (many){
    $("meter-fill").style.width = ((index + 1) / order.length * 100) + "%";
  }else{
    pips.textContent = "";
    order.forEach((_, i) => {
      const p = document.createElement("span");
      p.className = "pip" + (i < index ? " done" : i === index ? " here" : "");
      pips.appendChild(p);
    });
  }

  stepsEl.textContent = "";
  steps = labels.map((label, i) => {
    const b = document.createElement("button");
    b.className = "step";
    b.type = "button";

    const node = document.createElement("span");
    node.className = "node";

    const text = document.createElement("span");
    text.className = "step-label";
    text.textContent = label;

    b.append(node, text);
    b.addEventListener("mouseenter", () => moveTo(i));
    b.addEventListener("click", () => choose(i));
    stepsEl.appendChild(b);
    return b;
  });

  hover = picks[index] !== undefined ? picks[index] : middleOf(item);
  paint();
  place();
}

function paint(){
  steps.forEach((el, i) => {
    el.classList.toggle("on", i === hover);
    el.classList.toggle("picked", picks[index] === i);
  });
}

function place(){
  const el = steps[hover];
  if (!el) return;

  const stacked = window.matchMedia("(max-width:560px)").matches;
  const x = stacked ? 2 : el.offsetLeft + el.offsetWidth / 2 - selector.offsetWidth / 2;
  const y = stacked ? el.offsetTop + el.offsetHeight / 2 - selector.offsetHeight / 2 : 12;

  selector.style.transform = "translate(" + Math.round(x) + "px," + Math.round(y) + "px)";
}

let winding = null;
let target = null;
let afterLanding = null;

function moveTo(i, after){
  if (i < 0 || i >= steps.length){ if (after) after(); return; }
  if (i === hover && !after) return;

  target = i;
  if (after) afterLanding = after;

  if (winding) return;

  art.classList.remove("land");
  art.classList.add("wind");
  winding = setTimeout(land, WIND);
}

function land(){
  winding = null;

  const to = target, then = afterLanding;
  target = null;
  afterLanding = null;

  art.classList.remove("wind");

  if (to !== null && to !== hover){
    hover = to;
    paint();
    place();
    playHover();
  }

  void art.offsetWidth;
  art.classList.add("land");

  if (then) then();
}

function release(){
  clearTimeout(busyGuard);
  busyGuard = null;
  busy = false;
  if (screens.aside && screens.aside.classList.contains("on")){
    asideClose = null;
    show("quiz");
  }
}

function guard(ms){
  clearTimeout(busyGuard);
  busyGuard = setTimeout(() => { release(); render(); }, ms);
}

function choose(i){
  if (busy) return;
  if (i < 0 || i >= steps.length) return;

  busy = true;
  guard(1500);

  const commit = () => {
    guard(6000);
    try {
      picks[index] = i;
      if (qAt(index).once) sealed.add(index);
      paint();
      dismissOmen();
    } catch (e){ release(); render(); return; }

    const onward = () => {
      release();
      try {
        let next = index + 1;
        while (next < order.length && sealed.has(next)) next++;
        if (next < order.length){ index = next; render(); }
        else afterLast();
      } catch (e){ render(); }
    };

    if (index === interjectAt){
      interjectAt = -1;
      if (aliceMayAsk()) setTimeout(() => askAlice(onward), 220);
      else setTimeout(() => interject(onward, QUEEN_ASIDE), 220);
    }else if (index === aliceAt){
      aliceAt = -1;
      aliceSpoke = true;
      setTimeout(() => interject(onward, ALICE_ASIDE), 220);
    }else{
      setTimeout(onward, 150);
    }
  };

  if (i === hover && !winding) commit();
  else moveTo(i, commit);
}

function back(){
  let prev = index - 1;
  while (prev >= 0 && sealed.has(prev)) prev--;
  if (prev >= 0){ index = prev; render(); }
}

function nextSlot(){
  let next = index + 1;
  while (next < order.length && sealed.has(next)) next++;
  return next;
}

function forward(){
  if (picks[index] === undefined) return;
  const next = nextSlot();
  if (next < order.length){ index = next; render(); }
}

function middleStep(item){
  const n = scaleOf(item).length;
  return n % 2 ? (n - 1) / 2 : -1;
}

function neutralShare(){
  let answered = 0, middled = 0;
  order.forEach((srcIndex, i) => {
    if (picks[i] === undefined) return;
    answered++;
    const m = middleStep(QUESTIONS[srcIndex]);
    if (m >= 0 && picks[i] === m) middled++;
  });
  return answered ? middled / answered : 0;
}

function allSame(){
  const first = picks[0];
  if (first === undefined) return false;
  return order.every((_, i) => picks[i] === first);
}

function afterLast(){
  askChallenge(0);
}

let challengeAt = 0;

function askChallenge(i){
  challengeAt = i;
  $("challenge-q").textContent = CHALLENGE[i].q;
  show("check");
}

function stepBack(){
  let last = order.length - 1;
  while (last >= 0 && sealed.has(last)) last--;
  if (last < 0){ start(); return; }

  index = last;
  useMusic(QUIZ_MUSIC);
  show("quiz");
  render();
}

function answerChallenge(yes){
  if (challengeAt === 0) fadeOutMusic(2400);

  if (!yes){
    const onNo = CHALLENGE[challengeAt].onNo;
    if (onNo === "wight") finish(WIGHT);
    else if (onNo === "back") stepBack();
    else start();
    return;
  }

  if (challengeAt < CHALLENGE.length - 1){ askChallenge(challengeAt + 1); return; }

  const middling = neutralShare();
  finish((allSame() || middling >= NEUTRAL_WIGHT) ? WIGHT : null);
}

/* ---- scoring ---- */
function tally(){
  const sum = {}, seen = {};
  for (const id in TRAITS){ sum[id] = 0; seen[id] = 0; }

  order.forEach((srcIndex, i) => {
    const item = QUESTIONS[srcIndex];
    const pick = picks[i];
    if (pick === undefined) return;

    const targets = item.scores || (item.trait ? { [item.trait]: 1 } : {});

    const n = scaleOf(item).length;
    const agree = (item.reverse ? (n - 1 - pick) : pick) / (n - 1);

    for (const id in targets){
      if (!(id in sum)) continue;

      let weight = targets[id], other = null;

      if (weight && typeof weight === "object" && !Array.isArray(weight)){
        const pull = Math.abs(weight.mid);
        sum[id]  += (1 - Math.abs(agree - 0.5) * 2) * pull;
        seen[id] += pull;
        continue;
      }

      if (Array.isArray(weight)){ other = weight[1]; weight = weight[0]; }

      const pull = Math.abs(weight);
      const side = weight < 0 ? 1 - agree : agree;

      sum[id]  += side * (other === null ? pull : Math.abs(other));
      seen[id] += pull;
    }
  });

  const out = {};
  const steep = SPREAD * 4;
  const low = 1 - CEILING;

  const bottom = 1 / (1 + Math.exp(steep * 0.5));
  const top    = 1 / (1 + Math.exp(-steep * 0.5));
  const reach  = (top - bottom) || 1;

  for (const id in TRAITS){
    const raw = seen[id] ? sum[id] / seen[id] : 0.5;
    const curved = (1 / (1 + Math.exp(-steep * (raw - 0.5))) - bottom) / reach;
    out[id] = low + curved * (CEILING - low);
  }

  const middling = neutralShare();
  if (middling >= NEUTRAL_BLIGHTS && middling < NEUTRAL_WIGHT && NEUTRAL_VESSEL in out){
    out[NEUTRAL_VESSEL] = CEILING;
  }

  return out;
}

function breakable(label){ return label.split("/").join("/" + String.fromCharCode(8203)); }

const OF_AGE = "Eighteen or more";

function vesselView(v){
  if (v && v.adult && age === OF_AGE) return Object.assign({}, v, v.adult);
  return v;
}

function shortName(label){ return label.split(",")[0].trim(); }
function vesselName(id){ return shortName(vesselView(TRAITS[id]).label); }

function gapNote(winId, runnerId, gap){
  const won = vesselName(winId);
  const near = vesselName(runnerId);
  const by = gap.toFixed(1) + "%";

  if (gap > 5)
    return "You align with " + won + " far more closely than with any other. " +
           "The nearest, " + near + ", trails by " + by + ".";

  if (gap >= 2.5)
    return "You lean one way, though not heavily. " + near + " is right behind by only " + by + ".";

  return "A result, but only just. " + near + " came within " + by + " of taking it instead.";
}

function richInto(el, text){
  String(text == null ? "" : text).split(/\*\*(.+?)\*\*/g).forEach((piece, i) => {
    if (!piece) return;
    if (i % 2){
      const b = document.createElement("strong");
      b.textContent = piece;
      el.appendChild(b);
    }else{
      el.appendChild(document.createTextNode(piece));
    }
  });
}

function paragraphsInto(box, list){
  box.textContent = "";
  (list || []).forEach(text => {
    const p = document.createElement("p");
    richInto(p, text);
    box.appendChild(p);
  });
}

function paintVessel(prefix, v){
  const pic = $(prefix + "-art");
  if (v.image){
    pic.hidden = false;
    pic.onerror = () => { pic.hidden = true; };
    pic.src = asset(v.image);
  }else{
    pic.hidden = true;
    pic.removeAttribute("src");
  }

  $(prefix + "-title").textContent = breakable(v.label);
  paragraphsInto($(prefix + "-body"), v.body);

  const follyBox = $(prefix + "-folly");
  follyBox.textContent = "";
  if (v.folly){
    const wrap = document.createElement("div");
    wrap.className = "folly";
    if (v.lead){
      const lead = document.createElement("p");
      lead.className = "folly-lead";
      richInto(lead, v.lead);
      wrap.appendChild(lead);
    }
    const q = document.createElement("p");
    q.className = "folly-q";
    richInto(q, v.folly);
    wrap.appendChild(q);
    follyBox.appendChild(wrap);
  }

  const shadowBox = $(prefix + "-shadow");
  shadowBox.textContent = "";
  if (v.shadow){
    const wrap = document.createElement("div");
    wrap.className = "shadow prose";
    const h = document.createElement("h2");
    h.textContent = v.shadow.title;
    wrap.appendChild(h);
    const body = document.createElement("div");
    paragraphsInto(body, v.shadow.text);
    while (body.firstChild) wrap.appendChild(body.firstChild);
    shadowBox.appendChild(wrap);
  }
}

let lastScore = null;
let resultAccent = null;

/* ---- the result ---- */
function finish(special){
  const score = tally();
  lastScore = score;
  const ids = Object.keys(TRAITS);
  const winner = ids.reduce((best, id) => score[id] > score[best] ? id : best, ids[0]);
  const result = vesselView(special || TRAITS[winner]);

  if (special === WIGHT){ wightSeenSet(true); renderCredits(); }

  resultAccent = result.accent || null;
  useAccent(resultAccent);
  useBackground(result.background || null);
  if (special === WIGHT && settings.music < WIGHT_MIN_MUSIC){
    settings.music = WIGHT_MIN_MUSIC;
    saveSettings();
    applySettings();
  }

  useMusic(result.music || RESULT_MUSIC || null);

  paintVessel("verdict", result);

  markAlice(special ? null : winner);

  function tallyRow(id, isTop){
    const row = document.createElement("div");
    row.className = "tally-row" + (isTop ? " top" : "");

    const shown = vesselView(TRAITS[id]);

    const icon = document.createElement("span");
    icon.className = "tally-icon";
    if (shown.image){
      const im = document.createElement("img");
      im.src = asset(shown.image);
      im.alt = "";
      icon.appendChild(im);
    }

    const name = document.createElement("span");
    name.className = "tally-name";
    name.textContent = breakable(shown.label);

    const track = document.createElement("span");
    track.className = "tally-track";
    const fill = document.createElement("span");
    fill.className = "tally-fill";
    fill.style.width = Math.round(score[id] * 100) + "%";
    track.appendChild(fill);

    const pct = document.createElement("span");
    pct.className = "tally-pct";
    pct.textContent = Math.round(score[id] * 100) + "%";

    const tint = TRAITS[id].accent;
    if (tint){
      name.style.color = tint;
      fill.style.background = tint;
    }

    row.append(icon, name, track, pct);
    return row;
  }

  const others = $("others");
  const discarded = $("discarded");
  const box = $("tally");
  const castOff = $("discard-list");

  box.textContent = "";
  castOff.textContent = "";
  others.hidden = !SHOW_TALLY || !!special;
  discarded.hidden = !SHOW_TALLY || !!special;

  if (SHOW_TALLY && !special){
    const ranked = ids.slice().sort((a, b) => score[b] - score[a]);
    const runnerUp = ranked[1];

    $("gap-note").textContent = runnerUp
      ? gapNote(ranked[0], runnerUp, (score[ranked[0]] - score[runnerUp]) * 100)
      : "";

    ranked.slice(0, TALLY_TOP).forEach(id => box.appendChild(tallyRow(id, id === ranked[0])));

    const tail = ranked.slice(-TALLY_BOTTOM).filter(id => !ranked.slice(0, TALLY_TOP).includes(id));
    tail.forEach(id => castOff.appendChild(tallyRow(id, false)));
    discarded.hidden = tail.length === 0;
  }

  standing.hidden = true;
  saveRun(special === WIGHT);
  show("result");
  unrollResult();
}

/* ---- the gallery ---- */
function renderVessels(){
  const list = $("vessel-list");
  list.textContent = "";

  Object.keys(TRAITS).forEach(id => {
    const v = vesselView(TRAITS[id]);

    const card = document.createElement("button");
    card.type = "button";
    card.className = "vessel-card";

    if (v.image){
      const im = document.createElement("img");
      im.alt = "";
      im.onerror = () => im.remove();
      im.src = asset(v.image);
      card.appendChild(im);
    }

    const name = document.createElement("span");
    name.className = "vessel-name";
    name.textContent = breakable(v.label);
    if (v.accent) name.style.color = v.accent;
    card.appendChild(name);

    card.addEventListener("click", () => openVessel(id));
    list.appendChild(card);
  });
}

function openVessel(id){
  const v = vesselView(TRAITS[id]);
  paintVessel("vessel", v);

  const near = lastScore ? lastScore[id] : null;
  const bar = $("vessel-fill");
  const pct = $("vessel-pct");
  const row = bar.parentNode.parentNode;

  if (near == null){
    row.hidden = true;
  }else{
    row.hidden = false;
    bar.style.width = Math.round(near * 100) + "%";
    pct.textContent = Math.round(near * 100) + "%";
    if (v.accent) bar.style.background = v.accent;
  }

  useAccent(v.accent || null);
  show("vessel");
}

function renderAnswers(){
  const list = $("answer-list");
  list.textContent = "";

  const line = (n, q, a) => {
    const row = document.createElement("div");
    row.className = "answer-row";

    const num = document.createElement("span");
    num.className = "answer-n";
    num.textContent = n;

    const text = document.createElement("span");
    text.className = "answer-q";
    text.textContent = q;

    const ans = document.createElement("span");
    ans.className = "answer-a";
    ans.textContent = a;

    row.append(num, text, ans);
    list.appendChild(row);
  };

  if (age) line("-", "Art thou eighteen years or more?", age);

  order.forEach((srcIndex, i) => {
    const item = QUESTIONS[srcIndex];
    const pick = picks[i];
    line(i + 1, item.q, pick === undefined ? "-" : scaleOf(item)[pick]);
  });
}

document.addEventListener("keydown", e => {
  if (screens.aside.classList.contains("on")){
    if (e.key === "Enter" || e.key === " " || e.key === "Escape"){
      e.preventDefault();
      if (asideClose) asideClose();
    }
    return;
  }

  if (screens.check.classList.contains("on")){
    if (e.key === "Enter") { e.preventDefault(); answerChallenge(true); }
    if (e.key === "Escape"){ e.preventDefault(); answerChallenge(false); }
    return;
  }

  if (!screens.quiz.classList.contains("on")) return;

  switch (e.key){
    case "ArrowLeft":
    case "ArrowUp":   e.preventDefault(); moveTo(hover - 1); break;
    case "ArrowRight":
    case "ArrowDown": e.preventDefault(); moveTo(hover + 1); break;
    case "Enter":
    case " ":         e.preventDefault(); choose(hover); break;
    case "Backspace": e.preventDefault(); back(); break;
    default:
      if (e.key >= "1" && e.key <= "9"){
        const i = Number(e.key) - 1;
        if (i < steps.length) choose(i);
      }
  }
});

window.addEventListener("resize", place);

const cursorImg = $("crest-cursor");
cursorImg.addEventListener("error", () => {
  cursorImg.hidden = true;
  $("crest-fallback").hidden = false;
});

[cursorImg, $("crest-start")].forEach(img => { img.src = asset(CREST); });

$("title").textContent = QUIZ_TITLE;
$("intro").textContent = QUIZ_INTRO;
standing.textContent = STANDING_QUESTION;

function renderCredits(){
  const box = $("credits");
  if (!box) return;
  box.textContent = "";

  const people = document.createElement("div");
  people.className = "credits-row";
  CREDITS.forEach(c => {
    const span = document.createElement("span");
    const name = document.createElement("b");
    name.textContent = c.who + ": ";
    span.appendChild(name);
    span.appendChild(document.createTextNode(c.what));
    people.appendChild(span);
  });
  box.appendChild(people);

  const music = document.createElement("div");
  music.className = "credits-row";
  CREDIT_MUSIC.forEach(m => {
    const span = document.createElement("span");
    const name = document.createElement("b");
    const found = m.seen === "wight" ? wightSeen() : aliceSeen();
    name.textContent = ((m.veiled && !found) ? m.veiled : m.what) + ": ";
    span.appendChild(name);
    const a = document.createElement("a");
    a.href = m.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.textContent = "source";
    span.appendChild(a);
    music.appendChild(span);
  });
  box.appendChild(music);
}
function showCredits(open){
  const panel = $("credits-panel");
  const btn = $("credits-btn");
  if (!panel) return;
  btn.setAttribute("aria-expanded", open ? "true" : "false");
  if (open){
    panel.hidden = false;
    requestAnimationFrame(() => panel.classList.add("on"));
  }else{
    panel.classList.remove("on");
    setTimeout(() => { panel.hidden = true; }, 320);
  }
}


renderCredits();
loadSettings();
initAudio();

const spot = loadSpot();
if (spot && spot.track === currentTrack) seekTo(spot.at);

applySettings();

["pointerdown", "keydown"].forEach(ev => {
  document.addEventListener(ev, () => { unlockAudio(); applyMusic(); }, { once: true });
});

const cog = $("cog");
const panel = $("settings");

cog.addEventListener("click", e => {
  e.stopPropagation();
  const open = panel.classList.toggle("open");
  cog.setAttribute("aria-expanded", String(open));
});

panel.addEventListener("click", e => e.stopPropagation());

document.addEventListener("click", () => {
  unlockAudio();
  panel.classList.remove("open");
  cog.setAttribute("aria-expanded", "false");
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && panel.classList.contains("open")){
    panel.classList.remove("open");
    cog.setAttribute("aria-expanded", "false");
  }
});

$("set-background").addEventListener("click", () => {
  settings.background = !settings.background;
  saveSettings();
  applySettings();
});

$("set-music").addEventListener("input", e => {
  settings.music = Number(e.target.value);
  $("music-value").textContent = settings.music;
  saveSettings();
  applyMusic();
});

$("set-sound").addEventListener("input", e => {
  settings.sound = Number(e.target.value);
  $("sound-value").textContent = settings.sound;
  saveSettings();
});

$("begin").addEventListener("click", () => {
  unlockAudio();
  applyMusic();
  show("age");
});

function answerAge(value){
  age = value;
  start();
}

$("age-over").addEventListener("click", () => answerAge("Eighteen or more"));
$("age-under").addEventListener("click", () => answerAge("Under eighteen"));
screens.alice.addEventListener("click", e => {
  if (!aliceSkip) return;
  if (e.target.closest("button")) return;
  aliceSkip();
});

$("alice-yes").addEventListener("click", () => { if (aliceAnswer){ const a = aliceAnswer; aliceAnswer = null; a(true); } });
$("alice-no").addEventListener("click", () => { if (aliceAnswer){ const a = aliceAnswer; aliceAnswer = null; a(false); } });

$("credits-btn").addEventListener("click", () => showCredits(true));
$("credits-close").addEventListener("click", () => showCredits(false));
$("credits-panel").addEventListener("click", e => {
  if (e.target === $("credits-panel")) showCredits(false);
});

$("back").addEventListener("click", back);
$("forward").addEventListener("click", forward);
$("say-yes").addEventListener("click", () => answerChallenge(true));
$("say-no").addEventListener("click", () => answerChallenge(false));
$("see-vessels").addEventListener("click", () => { renderVessels(); show("vessels"); });
$("see-answers").addEventListener("click", () => { renderAnswers(); show("answers"); });
$("vessels-back").addEventListener("click", () => { useAccent(resultAccent); show("result"); });
$("vessel-back").addEventListener("click", () => { useAccent(resultAccent); show("vessels"); });
$("answers-back").addEventListener("click", () => show("result"));

$("reset").addEventListener("click", () => {
  clearRun();
  picks = [];
  age = null;
  index = 0;
  useAccent(null);
  useBackground(null);
  useMusic(null);
  standing.hidden = true;
  show("start");
});

const saved = loadRun();
if (saved && Array.isArray(saved.picks) && Array.isArray(saved.order)
    && saved.order.length === QUESTIONS.length
    && saved.picks.length === saved.order.length){
  order = saved.order;
  picks = saved.picks;
  age = saved.age || null;
  aliceBlessed = !!saved.blessed;
  finish(saved.wight ? WIGHT : null);
}
