<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Find out what kind of poor soul you truly are.">
<link rel="icon" href="crest.png">
<meta property="og:title" content="Ash Queen Personality Test">
<meta property="og:description" content="Find out what kind of poor soul you truly are.">
<meta property="og:image" content="crest.png">
<meta name="theme-color" content="#000000">
<title>Ash Queen Personality Test</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Karla:ital,wght@0,400;0,600;1,400&display=swap">
<style>
  :root{
    --ink:#000;
    --gold:#f2a73b;
    --gold-dim:#7d5a22;
    --gold-faint:rgba(242,167,59,.22);
    --purple:#7b1e86;
    --orchid:#c0459f;
    --ember:#f0592b;
    --text:#f3e9dc;
    --muted:#9a8aa0;          /* grey pulled toward the crest purple */
    --wind:100ms;             /* the selector's wind-up. change it here. */
  }

  *{box-sizing:border-box}

  body{
    background:var(--ink);
    color:var(--text);
    font-family:Karla,"Segoe UI",system-ui,sans-serif;
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }

  /* the background layer. empty for now - drop an image, video or canvas
     in here later and the settings toggle already controls it. */
  #quizBackground{
    position:fixed;
    inset:0;
    z-index:-1;
    pointer-events:none;
    background:var(--ink) center/cover no-repeat;
  }
  /* a result may bring its own scene - the scrim keeps the plate readable
     and stops a busy picture fighting the text on top of it */
  #quizBackground.has-art::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.2);
  }
  body.bg-off #quizBackground{display:none}

  /* while a result carries a scene, the plate turns translucent so the art
     reads through it. The blur keeps the text crisp over moving pictures. */
  body.has-scene .plate{
    background:rgba(0,0,0,.78);
    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
  }
  /* switching the background off puts the solid plate back */
  body.bg-off .plate{
    background:var(--ink);
    backdrop-filter:none;
    -webkit-backdrop-filter:none;
  }

  .wrap{
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding-block:40px;
    padding-left:18px;
    padding-right:18px;
  }

  /* ---------------- the plate ---------------- */

  .plate{
    position:relative;
    width:100%;
    max-width:680px;
    margin-block:auto;
    border:1px solid var(--gold-dim);
    background:var(--ink);
    padding:clamp(26px,5vw,46px);
  }
  .plate::before{
    content:"";
    position:absolute;
    inset:6px;
    border:1px solid var(--gold-faint);
    pointer-events:none;
  }

  .screen{display:none}
  .screen.on{display:block}

  h1,h2{
    font-family:Cinzel,Georgia,serif;
    font-weight:700;
    letter-spacing:.06em;
    text-wrap:balance;
    margin:0;
  }
  h1{
    font-size:clamp(25px,5.2vw,37px);
    line-height:1.15;
    color:var(--gold);
    text-transform:uppercase;
    overflow-wrap:break-word;      /* "Blacksmith/Merchant" has nowhere to break */
    hyphens:auto;
  }

  .rule{
    height:1px;
    background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);
    margin:18px 0 24px;
  }

  .lede{
    color:var(--muted);
    margin:0 0 30px;
    max-width:54ch;
  }

  /* ---------------- buttons ---------------- */

  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  :focus-visible{outline:2px solid var(--gold);outline-offset:3px}

  .btn{
    font-family:Cinzel,Georgia,serif;
    font-weight:700;
    font-size:14px;
    letter-spacing:.14em;
    text-transform:uppercase;
    padding:13px 30px;
    color:var(--ink);
    background:var(--gold);
    border:1px solid var(--gold);
    transition:background .14s,color .14s;
  }
  .btn:hover{background:transparent;color:var(--gold)}

  .btn-quiet{
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--muted);
    padding:9px 16px;
    border:1px solid var(--gold-faint);
    transition:color .14s,border-color .14s;
  }
  .btn-quiet:hover{color:var(--gold);border-color:var(--gold-dim)}

  /* ---------------- settings ---------------- */

  .cog{
    position:absolute;
    top:12px;right:12px;
    width:34px;height:34px;
    display:grid;
    place-items:center;
    color:var(--gold-dim);
    z-index:3;
    transition:color .15s,transform .25s ease;
  }
  .cog:hover{color:var(--gold);transform:rotate(35deg)}
  .cog svg{width:19px;height:19px;display:block}

  .settings{
    position:absolute;
    top:52px;right:12px;
    width:250px;
    padding:18px;
    background:var(--ink);
    border:1px solid var(--gold-dim);
    z-index:4;
    display:none;
  }
  .settings.open{display:block}

  .settings h2{
    font-size:12px;
    letter-spacing:.2em;
    color:var(--muted);
    text-transform:uppercase;
    margin-bottom:16px;
  }

  .setting{margin-bottom:17px}
  .setting:last-child{margin-bottom:0}

  .setting-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    margin-bottom:7px;
  }
  .setting-name{
    font-size:12.5px;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--text);
  }
  .setting-value{
    font-size:11.5px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }

  .setting input[type=range]{
    width:100%;
    accent-color:var(--gold);
    background:transparent;
    cursor:pointer;
  }

  .toggle{
    width:100%;
    padding:7px 0;
    font-size:11.5px;
    letter-spacing:.12em;
    text-transform:uppercase;
    border:1px solid var(--gold-faint);
    color:var(--muted);
    transition:color .14s,border-color .14s,background .14s;
  }
  .toggle[aria-pressed="true"]{
    color:var(--ink);
    background:var(--gold);
    border-color:var(--gold);
  }

  /* ---------------- start screen ---------------- */

  .opening{
    display:flex;
    align-items:center;
    gap:clamp(18px,4vw,34px);
    flex-wrap:wrap;
  }
  .opening-crest{
    width:clamp(84px,17vw,122px);
    flex:none;
    filter:drop-shadow(0 0 16px rgba(192,69,159,.4));
  }
  .opening-copy{flex:1 1 260px;min-width:0}

  /* ---------------- the standing question ---------------- */

  .standing{
    font-family:Cinzel,Georgia,serif;
    font-size:clamp(19px,3.8vw,27px);
    font-weight:700;
    letter-spacing:.07em;
    text-transform:uppercase;
    color:var(--gold);
    text-align:center;
    margin:0 0 26px;
    padding-bottom:20px;
    border-bottom:1px solid var(--gold-faint);
  }

  /* ---------------- progress ---------------- */

  .progress{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:26px;
  }
  .pips{display:flex;gap:7px;flex-wrap:wrap}
  .pips[hidden]{display:none}

  /* too many questions for dots - use a bar instead */
  .meter{flex:1;height:3px;background:var(--gold-faint)}
  .meter[hidden]{display:none}
  .meter-fill{
    display:block;                 /* a span is inline - height would not apply */
    height:100%;
    width:0;
    background:var(--gold);
    transition:width .25s ease;
  }
  .pip{
    width:9px;height:9px;
    transform:rotate(45deg);
    border:1px solid var(--gold-dim);
    transition:background .18s,border-color .18s;
  }
  .pip.done{background:var(--gold-dim);border-color:var(--gold-dim)}
  .pip.here{background:var(--gold);border-color:var(--gold)}

  .count{
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
    margin-left:auto;
  }

  /* ---------------- the statement ---------------- */

  .statement{
    font-family:Cinzel,Georgia,serif;
    font-size:clamp(19px,3.5vw,26px);
    font-weight:500;
    line-height:1.42;
    letter-spacing:.01em;
    text-wrap:balance;
    margin:0 0 8px;
    min-height:2.9em;
    color:var(--text);
  }

  /* ---------------- the scale ---------------- */

  .scale{
    position:relative;
    padding-top:76px;
    margin-bottom:28px;
  }

  .steps{
    position:relative;
    display:flex;
    gap:2px;
  }
  .steps::before{
    content:"";
    position:absolute;
    top:7px;left:10%;right:10%;
    height:1px;
    background:var(--gold-faint);
  }

  .step{
    flex:1 1 0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    padding:0 2px 6px;
  }

  .node{
    width:15px;height:15px;
    transform:rotate(45deg);
    border:1px solid var(--gold-dim);
    background:var(--ink);
    transition:background .12s,border-color .12s,box-shadow .12s;
    position:relative;
    z-index:1;
  }
  .step.on .node{
    border-color:var(--gold);
    background:var(--gold);
    box-shadow:0 0 10px rgba(242,167,59,.55);
  }
  .step.picked .node{background:var(--orchid);border-color:var(--orchid)}

  .step-label{
    font-size:11.5px;
    line-height:1.35;
    letter-spacing:.02em;
    color:var(--muted);
    text-align:center;
    transition:color .12s;
  }
  .step.on .step-label{color:var(--gold)}

  /* the selector ----------------------------- */

  .selector{
    position:absolute;
    top:0;left:0;
    width:46px;height:57px;
    pointer-events:none;
    transition:none;                  /* it never glides - it cuts */
  }
  .selector-art{
    position:relative;
    display:block;width:100%;height:100%;
    transform-origin:50% 72%;
    filter:drop-shadow(0 0 8px rgba(192,69,159,.55));
  }
  .selector-art img,
  .selector-art svg{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:contain;
    display:block;
  }
  .selector-art [hidden]{display:none !important}

  .selector-art.wind{animation:wind var(--wind) ease-in forwards}
  .selector-art.land{animation:land 150ms cubic-bezier(.2,1.7,.4,1)}

  @keyframes wind{
    from{transform:scale(1) translateY(0)}
    to  {transform:scale(.58) translateY(7px)}
  }
  @keyframes land{
    0%  {transform:scale(.58) translateY(7px)}
    52% {transform:scale(1.2) translateY(-3px)}
    100%{transform:scale(1) translateY(0)}
  }

  .footer{display:flex;align-items:center;gap:12px}

  /* ---------------- the challenge ---------------- */

  .challenge{
    min-height:clamp(140px,26vh,200px);
    display:flex;
    align-items:center;
  }
  .challenge-q{
    font-family:Cinzel,Georgia,serif;
    font-size:clamp(20px,3.8vw,28px);
    font-weight:500;
    line-height:1.4;
    color:var(--text);
    text-wrap:balance;
    margin:0;
  }
  .challenge-row{display:flex;gap:12px;margin-top:8px}

  /* ---------------- result ---------------- */

  .verdict{display:flex;gap:clamp(18px,4vw,32px);align-items:center;flex-wrap:wrap}

  /* sized by BOTH limits so a wide banner and a tall crest both fit */
  .verdict-art{
    width:auto;height:auto;
    max-width:clamp(150px,36vw,250px);
    max-height:170px;
    object-fit:contain;
    flex:none;
  }
  .verdict-art[hidden]{display:none}
  .verdict-copy{flex:1 1 240px;min-width:0}

  .eyebrow{
    font-size:11.5px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 9px;
  }

  .prose p{
    color:var(--muted);
    margin:0 0 1.15em;
    max-width:62ch;
  }
  .prose{margin-top:26px}

  .folly{
    margin:30px 0;
    padding:22px 24px;
    border:1px solid var(--gold-faint);
    border-left:2px solid var(--gold);
  }
  .folly-lead{
    font-size:13.5px;
    color:var(--muted);
    margin:0 0 12px;
  }
  .folly-q{
    font-family:Cinzel,Georgia,serif;
    font-size:clamp(17px,3vw,21px);
    line-height:1.45;
    color:var(--gold);
    margin:0;
    text-wrap:balance;
  }

  .shadow{
    margin-top:36px;
    padding-top:26px;
    border-top:1px solid var(--gold-faint);
  }
  .shadow h2{
    font-size:clamp(19px,3.4vw,25px);
    color:var(--gold);
    text-transform:uppercase;
    margin-bottom:18px;
  }
  .shadow p:last-child{color:var(--text)}

  .tally{margin:34px 0 28px}
  .tally-row{
    display:grid;
    grid-template-columns:26px minmax(104px,1.5fr) 1fr auto;
    align-items:center;
    gap:11px;
    padding:6px 0;
    font-size:13px;
    color:var(--muted);
    border-bottom:1px solid var(--gold-faint);
  }
  .tally-icon{
    width:26px;height:26px;
    display:grid;place-items:center;
  }
  .tally-icon img{
    max-width:100%;max-height:100%;
    object-fit:contain;
    display:block;
  }
  .tally-name{
    font-family:Cinzel,Georgia,serif;
    letter-spacing:.03em;
    font-size:12.5px;
    min-width:0;
    overflow-wrap:anywhere;
  }
  .tally-track{height:3px;background:var(--gold-faint)}
  .tally-fill{display:block;height:100%;width:0;background:var(--gold-dim)}
  .tally-pct{font-variant-numeric:tabular-nums;font-size:12px}
  .tally-row.top{color:var(--text)}
  .tally-row.top .tally-name{font-weight:700}

  /* ---------------- other vessels ---------------- */

  .others{
    margin-top:36px;
    padding-top:26px;
    border-top:1px solid var(--gold-faint);
  }
  .others[hidden]{display:none}
  .others h3{
    font-family:Cinzel,Georgia,serif;
    font-size:clamp(14px,2.4vw,17px);
    font-weight:700;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 14px;
  }
  .gap-note{
    color:var(--muted);
    font-size:14px;
    margin:0 0 22px;
    max-width:60ch;
  }

  /* ---------------- the footer of the result ---------------- */

  .result-actions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    margin-top:36px;
    padding-top:24px;
    border-top:1px solid var(--gold-faint);
  }

  /* deliberately dimmer than the others - it throws the run away */
  .btn-dark{
    font-family:Cinzel,Georgia,serif;
    font-size:11.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    padding:9px 18px;
    color:#6b626e;
    background:#090909;
    border:1px solid #241f26;
    margin-left:auto;
    transition:color .14s,border-color .14s;
  }
  .btn-dark:hover{color:var(--text);border-color:#4a434c}

  /* ---------------- the vessel gallery ---------------- */

  .vessel{
    display:flex;
    gap:18px;
    align-items:flex-start;
    padding:24px 0;
    border-bottom:1px solid var(--gold-faint);
  }
  .vessel:last-child{border-bottom:none}
  .vessel img{
    width:78px;
    max-height:78px;
    object-fit:contain;
    flex:none;
  }
  .vessel-copy{flex:1 1 220px;min-width:0}
  .vessel h3{
    font-family:Cinzel,Georgia,serif;
    font-size:16px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 9px;
    overflow-wrap:break-word;
  }
  .vessel p{color:var(--muted);font-size:14px;margin:0 0 .85em}
  .vessel p:last-child{margin-bottom:0}

  /* ---------------- the answer sheet ---------------- */

  .answer-row{
    display:grid;
    grid-template-columns:30px 1fr auto;
    gap:12px;
    align-items:baseline;
    padding:10px 0;
    border-bottom:1px solid var(--gold-faint);
  }
  .answer-n{
    color:var(--muted);
    font-size:12px;
    font-variant-numeric:tabular-nums;
  }
  .answer-q{color:var(--text);font-size:14px;min-width:0}
  .answer-a{
    color:var(--gold);
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    text-align:right;
  }

  @media (prefers-reduced-motion:reduce){
    .selector-art.wind,.selector-art.land{animation:none}
    *{transition-duration:.01ms !important}
  }

  /* ---------------- narrow ---------------- */

  @media (max-width:560px){
    .scale{padding-top:0;padding-left:54px}
    .steps{flex-direction:column;gap:7px}
    .steps::before{display:none}
    .step{
      flex-direction:row;
      justify-content:flex-start;
      gap:14px;
      padding:11px 14px;
      border:1px solid var(--gold-faint);
    }
    .step.on{border-color:var(--gold-dim)}
    .step-label{font-size:14px;text-align:left}
    .selector{width:40px;height:50px}
    .answer-row{grid-template-columns:24px 1fr;gap:8px}
    .answer-a{grid-column:2;text-align:left;margin-top:2px}
    .btn-dark{margin-left:0;width:100%;text-align:center}
    .vessel img{width:58px;max-height:58px}
    .tally-row{grid-template-columns:24px 1fr auto;gap:9px}
    .tally-icon{width:24px;height:24px}
    .tally-track{display:none}
    .settings{width:calc(100% - 24px)}
  }
</style>
</head>
<body>

<div id="quizBackground"></div>

<div class="wrap">
  <div class="plate">

    <!-- ===================== SETTINGS ===================== -->
    <button class="cog" id="cog" aria-label="Settings" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <g fill="currentColor">
          <rect x="10.85" y="1.6" width="2.3" height="4.6" rx=".7"/>
          <rect x="10.85" y="1.6" width="2.3" height="4.6" rx=".7" transform="rotate(45 12 12)"/>
          <rect x="10.85" y="1.6" width="2.3" height="4.6" rx=".7" transform="rotate(90 12 12)"/>
          <rect x="10.85" y="1.6" width="2.3" height="4.6" rx=".7" transform="rotate(135 12 12)"/>
          <rect x="10.85" y="1.6" width="2.3" height="4.6" rx=".7" transform="rotate(180 12 12)"/>
          <rect x="10.85" y="1.6" width="2.3" height="4.6" rx=".7" transform="rotate(225 12 12)"/>
          <rect x="10.85" y="1.6" width="2.3" height="4.6" rx=".7" transform="rotate(270 12 12)"/>
          <rect x="10.85" y="1.6" width="2.3" height="4.6" rx=".7" transform="rotate(315 12 12)"/>
        </g>
        <circle cx="12" cy="12" r="6.1" fill="none" stroke="currentColor" stroke-width="2.2"/>
        <circle cx="12" cy="12" r="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
      </svg>
    </button>

    <div class="settings" id="settings" role="dialog" aria-label="Settings">
      <h2>Settings</h2>

      <div class="setting">
        <div class="setting-head"><span class="setting-name">Background</span></div>
        <button class="toggle" id="set-background" aria-pressed="true">Enabled</button>
      </div>

      <div class="setting">
        <div class="setting-head">
          <span class="setting-name">Music</span>
          <span class="setting-value" id="music-value">40</span>
        </div>
        <input type="range" id="set-music" min="0" max="100" step="1" value="40">
      </div>

      <div class="setting">
        <div class="setting-head">
          <span class="setting-name">Sound</span>
          <span class="setting-value" id="sound-value">70</span>
        </div>
        <input type="range" id="set-sound" min="0" max="100" step="1" value="70">
      </div>
    </div>

    <!-- the question that stays overhead through the quiz -->
    <p class="standing" id="standing" hidden></p>

    <!-- ===================== START ===================== -->
    <section class="screen on" id="s-start">
      <div class="opening">
        <img class="opening-crest" id="crest-start" alt="">
        <div class="opening-copy">
          <h1 id="title"></h1>
          <div class="rule"></div>
          <p class="lede" id="intro"></p>
          <button class="btn" id="begin">Begin</button>
        </div>
      </div>
    </section>

    <!-- ===================== QUIZ ===================== -->
    <section class="screen" id="s-quiz">
      <div class="progress">
        <div class="pips" id="pips"></div>
        <div class="meter" id="meter" hidden><span class="meter-fill" id="meter-fill"></span></div>
        <span class="count" id="count"></span>
      </div>

      <p class="statement" id="statement" aria-live="polite"></p>

      <div class="scale" id="scale">
        <div class="selector" id="selector" aria-hidden="true">
          <div class="selector-art" id="selector-art">
            <img id="crest-cursor" alt="">
            <svg id="crest-fallback" viewBox="0 0 32 36" hidden>
              <path d="M16 1.5 L30.5 6.5 V19 C30.5 27 24 32.5 16 34.5 C8 32.5 1.5 27 1.5 19 V6.5 Z"
                    fill="none" stroke="#f2a73b" stroke-width="2.2" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
        <div class="steps" id="steps"></div>
      </div>

      <div class="footer">
        <button class="btn-quiet" id="back">Back</button>
      </div>
    </section>

    <!-- ===================== AGE ===================== -->
    <section class="screen" id="s-age">
      <div class="challenge">
        <p class="challenge-q">Before you begin: are you above or below 18?</p>
      </div>

function scaleOf(q){ return SCALES[q.scale || DEFAULT_SCALE]; }
function middleOf(q){ return Math.floor(scaleOf(q).length / 2); }

/* Every picture and sound goes through here, so a version bump forces the
   browser to fetch the new file instead of its cached one. Opened straight
   off disk there is no cache to bust, and a "?v=" can stop the file being
   found at all - so the stamp is only added when served over http(s). */
const SERVED = location.protocol === "http:" || location.protocol === "https:";
function asset(path){ return SERVED ? path + "?v=" + ASSET_VERSION : path; }

/* ---------------- the accent swap ---------------- */

function hexParts(hex){
  const h = hex.replace("#", "");
  const n = h.length === 3 ? h.split("").map(c => c + c).join("") : h;
  return [0, 2, 4].map(i => parseInt(n.slice(i, i + 2), 16));
}

/* everything that was gold takes the result's colour instead */
function useAccent(hex){
  const root = document.documentElement;
  if (!hex){
    root.style.removeProperty("--gold");
    root.style.removeProperty("--gold-dim");
    root.style.removeProperty("--gold-faint");
    return;
  }
  const [r, g, b] = hexParts(hex);
  root.style.setProperty("--gold", hex);
  root.style.setProperty("--gold-dim",
    "rgb(" + Math.round(r * .72) + "," + Math.round(g * .72) + "," + Math.round(b * .72) + ")");
  root.style.setProperty("--gold-faint", "rgba(" + r + "," + g + "," + b + ",.34)");
}

   A completed test stays on the result screen when they come back.
   Only Reset clears it. */

  try{

}

function loadRun(){
  try{ return JSON.parse(localStorage.getItem(RUN_KEY) || "null"); }
  catch(e){ return null; }
}

function clearRun(){
  try{ localStorage.removeItem(RUN_KEY); }catch(e){}
}

  if (url){
    bg.style.backgroundImage = "url('" + asset(url) + "')";
    bg.classList.add("has-art");
  }else{
    bg.style.backgroundImage = "";
    bg.classList.remove("has-art");
  }
  /* the plate reads the same flag to decide whether to turn translucent */
  document.body.classList.toggle("has-scene", !!url);
}

/* ---------------- settings ---------------- */

const STORE_KEY = "ash-queen-settings";
let settings = Object.assign({}, DEFAULT_SETTINGS);

function loadSettings(){
  try{
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
    settings = Object.assign({}, DEFAULT_SETTINGS, saved);
  }catch(e){ /* private window, blocked storage - defaults are fine */ }
}

function saveSettings(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(settings)); }catch(e){}
}

function applySettings(){
  document.body.classList.toggle("bg-off", !settings.background);

  const bgBtn = $("set-background");
  bgBtn.setAttribute("aria-pressed", String(settings.background));
  bgBtn.textContent = settings.background ? "Enabled" : "Disabled";

  $("set-music").value = settings.music;
  $("music-value").textContent = settings.music;
  $("set-sound").value = settings.sound;
  $("sound-value").textContent = settings.sound;

  applyMusic();
}

/* ---------------- audio ---------------- */

let hoverPool = [];      /* several copies so quick moves can overlap */
let hoverNext = 0;
let music = null;
let lastHoverAt = 0;
let musicWanted = false;
let unlocked = false;
let currentTrack = MUSIC_TRACK;   /* a result may swap this out */

function initAudio(){
  for (let i = 0; i < 4; i++){
    const a = new Audio(asset(SOUND_HOVER));
    a.preload = "auto";
    hoverPool.push(a);
  }

  music = new Audio(asset(MUSIC_TRACK));
  music.loop = true;
  music.preload = "auto";
}

/* A browser refuses to play anything until the page has been interacted
   with. Hovering doesn't count as interaction - so on the first real
   click we play each clip silently to get permission for later. */
function unlockAudio(){
  if (unlocked) return;
  unlocked = true;

  hoverPool.forEach(a => {
    a.volume = 0;
    const p = a.play();
    if (p && p.then) p.then(() => { a.pause(); a.currentTime = 0; }).catch(() => {});
  });
}

/* plays when the selector lands on an option, nowhere else */
function playHover(){
  if (settings.sound <= 0 || !hoverPool.length) return;

  const now = performance.now();
  if (now - lastHoverAt < 45) return;
  lastHoverAt = now;

  hoverNext = (hoverNext + 1) % hoverPool.length;
  const a = hoverPool[hoverNext];

  try{
    a.currentTime = 0;
    a.volume = settings.sound / 100;
    const p = a.play();
    if (p && p.catch) p.catch(() => {});
  }catch(e){}
}

function applyMusic(){
  if (!music) return;
  music.volume = settings.music / 100;
  if (settings.music > 0 && musicWanted) music.play().catch(() => {});
  else music.pause();
}

/* swap the playing track - pass nothing to go back to the usual one */
function useMusic(track){
  const want = track || MUSIC_TRACK;
  if (!music || want === currentTrack) return;

  currentTrack = want;
  music.pause();
  music.currentTime = 0;
  music.src = asset(want);
  applyMusic();
}

/* ---------------- rendering ---------------- */

function start(){
  index = 0;
  picks = [];
  useAccent(null);                    // back to gold for the questions
  useBackground(null);
  useMusic(null);
  standing.hidden = !STANDING_QUESTION;
  show("quiz");
  render();
}

function render(){
  const item = QUESTIONS[index];
  const labels = scaleOf(item);

  $("statement").textContent = item.q;
  $("count").textContent = (index + 1) + " of " + QUESTIONS.length;
  $("back").style.visibility = index === 0 ? "hidden" : "visible";

  /* dots for a short quiz, a bar for a long one */
  const many = QUESTIONS.length > 12;
  const pips = $("pips");
  const meter = $("meter");
  pips.hidden = many;
  meter.hidden = !many;

  if (many){
    /* full on the last question, so it agrees with the count beside it */
    $("meter-fill").style.width = ((index + 1) / QUESTIONS.length * 100) + "%";
  }else{
    pips.textContent = "";
    QUESTIONS.forEach((_, i) => {
      const p = document.createElement("span");
      p.className = "pip" + (i < index ? " done" : i === index ? " here" : "");
      pips.appendChild(p);
    });
  }

  stepsEl.textContent = "";
  steps = labels.map((label, i) => {
    const b = document.createElement("button");
    b.className = "step";
    b.type = "button";

    const node = document.createElement("span");
    node.className = "node";

    const text = document.createElement("span");
    text.className = "step-label";
    text.textContent = label;

    b.append(node, text);
    b.addEventListener("mouseenter", () => moveTo(i));
    b.addEventListener("click", () => choose(i));
    stepsEl.appendChild(b);
    return b;
  });

  hover = picks[index] !== undefined ? picks[index] : middleOf(item);
  paint();
  place();
}

function paint(){
  steps.forEach((el, i) => {
    el.classList.toggle("on", i === hover);
    el.classList.toggle("picked", picks[index] === i);
  });
}

/* ---------------- the selector ---------------- */

/* drop it on the current step with no travel whatsoever */
function place(){
  const el = steps[hover];
  if (!el) return;

  const stacked = window.matchMedia("(max-width:560px)").matches;
  const x = stacked ? 2 : el.offsetLeft + el.offsetWidth / 2 - selector.offsetWidth / 2;
  const y = stacked ? el.offsetTop + el.offsetHeight / 2 - selector.offsetHeight / 2 : 12;

  selector.style.transform = "translate(" + Math.round(x) + "px," + Math.round(y) + "px)";
}

/* Wind up in place, then cut to the target.
   A move already in flight is NOT restarted - it just gets a new
   destination, so waving the mouse keeps landing instead of stalling. */
let winding = null;
let target = null;
let afterLanding = null;

function moveTo(i, after){
  if (i < 0 || i >= steps.length) return;
  if (i === hover && !after) return;

  target = i;
  if (after) afterLanding = after;

  if (winding) return;              // in flight: it will use the latest target

  art.classList.remove("land");
  art.classList.add("wind");
  winding = setTimeout(land, WIND);
}

function land(){
  winding = null;

  const to = target, then = afterLanding;
  target = null;
  afterLanding = null;

  art.classList.remove("wind");

  if (to !== null && to !== hover){
    hover = to;
    paint();
    place();                        // instant: the transform has no transition
    playHover();
  }

  void art.offsetWidth;             // restart the landing beat
  art.classList.add("land");

  if (then) then();
}

/* ---------------- flow ---------------- */

function choose(i){
  if (busy) return;
  busy = true;

  const commit = () => {
    picks[index] = i;
    paint();
    setTimeout(() => {
      busy = false;
      if (index < QUESTIONS.length - 1){ index++; render(); }
      else afterLast();
    }, 150);
  };

  if (i === hover && !winding) commit();
  else moveTo(i, commit);
}

function back(){
  if (index > 0){ index--; render(); }
}

/* every statement answered with the same step - all Neutral, all Never,
   all Strongly disagree. A single column of answers says nothing at all. */
function allSame(){
  const first = picks[0];
  if (first === undefined) return false;
  return QUESTIONS.every((item, i) => picks[i] === first);
}

function afterLast(){
  askChallenge(0);          /* everyone is asked, not just the undecided */
}

/* ---------------- the challenge ---------------- */

let challengeAt = 0;

function askChallenge(i){
  challengeAt = i;
  $("challenge-q").textContent = CHALLENGE[i].q;
  show("check");
}

function answerChallenge(yes){
  if (!yes){
    /* admitting to lying shapes them into the Wight; anything else is a retake */
    if (CHALLENGE[challengeAt].onNo === "wight") finish(WIGHT);
    else start();
    return;
  }

  if (challengeAt < CHALLENGE.length - 1){ askChallenge(challengeAt + 1); return; }

  /* stood by their answers - but if the scale never moved, that is the Wight too */
  finish(allSame() ? WIGHT : null);
}

/* ---------------- scoring ---------------- */

function tally(){
  const sum = {}, seen = {};
  for (const id in TRAITS){ sum[id] = 0; seen[id] = 0; }

  QUESTIONS.forEach((item, i) => {
    const pick = picks[i];
    if (pick === undefined) return;

    /* a question may feed several results at once */
    const targets = item.scores || (item.trait ? { [item.trait]: 1 } : {});

    const n = scaleOf(item).length;
    const agree = (item.reverse ? n - pick : pick + 1) / n;   /* 0 - 1 */

    for (const id in targets){
      if (!(id in sum)) continue;
      const weight = targets[id];
      /* a negative weight means agreeing counts AGAINST that result */
      sum[id]  += (weight < 0 ? 1 - agree : agree) * Math.abs(weight);
      seen[id] += Math.abs(weight);
    }
  });

  const out = {};
  for (const id in TRAITS) out[id] = seen[id] ? sum[id] / seen[id] : 0;
  return out;
}

/* "Sonic, The Messenger" -> "Sonic" */
function shortName(label){ return label.split(",")[0].trim(); }

/* how decisive the result was, in plain words */
function gapNote(winId, runnerId, gap){
  const won = shortName(TRAITS[winId].label);
  const near = shortName(TRAITS[runnerId].label);
  const by = gap.toFixed(1) + "%";

  if (gap > 5)
    return "You align with " + won + " far more closely than with any other. " +
           "The nearest, " + near + ", trails by " + by + ".";

  if (gap >= 2.5)
    return "You lean one way, though not heavily. " + near + " is right behind by only " + by + ".";

  return "A result, but only just. " + near + " came within " + by + " of taking it instead.";
}

function paragraphsInto(box, list){
  box.textContent = "";
  (list || []).forEach(text => {
    const p = document.createElement("p");
    p.textContent = text;
    box.appendChild(p);
  });
}

function finish(special){
  const score = tally();
  const ids = Object.keys(TRAITS);
  const winner = ids.reduce((best, id) => score[id] > score[best] ? id : best, ids[0]);
  const result = special || TRAITS[winner];

  useAccent(result.accent || null);
  useBackground(result.background || null);
  useMusic(result.music || null);

  /* No silent swap to the crest: a result with no picture shows none,
     and a picture that fails to load stays hidden rather than pretending. */
  const pic = $("verdict-art");
  if (result.image){
    pic.hidden = false;
    pic.onerror = () => { pic.hidden = true; };
    pic.src = asset(result.image);
  }else{
    pic.hidden = true;
    pic.removeAttribute("src");
  }

  $("verdict-title").textContent = result.label;
  paragraphsInto($("verdict-body"), result.body);

  const follyBox = $("verdict-folly");
  follyBox.textContent = "";
  if (result.folly){
    const wrap = document.createElement("div");
    wrap.className = "folly";
    if (result.lead){
      const lead = document.createElement("p");
      lead.className = "folly-lead";
      lead.textContent = result.lead;
      wrap.appendChild(lead);
    }
    const q = document.createElement("p");
    q.className = "folly-q";
    q.textContent = result.folly;
    wrap.appendChild(q);
    follyBox.appendChild(wrap);
  }

  const shadowBox = $("verdict-shadow");
  shadowBox.textContent = "";
  if (result.shadow){
    const wrap = document.createElement("div");
    wrap.className = "shadow prose";
    const h = document.createElement("h2");
    h.textContent = result.shadow.title;
    wrap.appendChild(h);
    const body = document.createElement("div");
    paragraphsInto(body, result.shadow.text);
    while (body.firstChild) wrap.appendChild(body.firstChild);
    shadowBox.appendChild(wrap);
  }

  /* the Wight is not a score - it stands with no others beside it */
  const others = $("others");
  const box = $("tally");
  box.textContent = "";
  others.hidden = !SHOW_TALLY || !!special;

  if (SHOW_TALLY && !special){
    const ranked = ids.slice().sort((a, b) => score[b] - score[a]);
    const runnerUp = ranked[1];

    $("gap-note").textContent = runnerUp
      ? gapNote(ranked[0], runnerUp, (score[ranked[0]] - score[runnerUp]) * 100)
      : "";

    /* every vessel you could have been, the strongest first */
    ranked.slice(0, TALLY_TOP).forEach(id => {
      const row = document.createElement("div");
      row.className = "tally-row" + (id === ranked[0] ? " top" : "");

      /* the little face beside each name */
      const icon = document.createElement("span");
      icon.className = "tally-icon";
      if (TRAITS[id].image){
        const im = document.createElement("img");
        im.src = asset(TRAITS[id].image);
        im.alt = "";
        icon.appendChild(im);
      }

      const name = document.createElement("span");
      name.className = "tally-name";
      name.textContent = TRAITS[id].label;

      const track = document.createElement("span");
      track.className = "tally-track";
      const fill = document.createElement("span");
      fill.className = "tally-fill";
      fill.style.width = Math.round(score[id] * 100) + "%";
      track.appendChild(fill);

      const pct = document.createElement("span");
      pct.className = "tally-pct";
      pct.textContent = Math.round(score[id] * 100) + "%";

      /* each vessel wears its own colour, not the winner's */
      const tint = TRAITS[id].accent;
      if (tint){
        name.style.color = tint;
        fill.style.background = tint;
      }

      row.append(icon, name, track, pct);
      box.appendChild(row);
    });
  }

  standing.hidden = true;
  saveRun(special === WIGHT);
  show("result");
}

/* ---------------- the other screens ---------------- */

function renderVessels(){
  const list = $("vessel-list");
  list.textContent = "";

  Object.keys(TRAITS).map(id => TRAITS[id]).concat([WIGHT]).forEach(v => {
    const row = document.createElement("div");
    row.className = "vessel";

    if (v.image){
      const im = document.createElement("img");
      im.alt = "";
      im.onerror = () => im.remove();
      im.src = asset(v.image);
      row.appendChild(im);
    }

    const copy = document.createElement("div");
    copy.className = "vessel-copy";

    const h = document.createElement("h3");
    h.textContent = v.label;
    copy.appendChild(h);

    (v.body || []).forEach(text => {
      const p = document.createElement("p");
      p.textContent = text;
      copy.appendChild(p);
    });

    row.appendChild(copy);
    list.appendChild(row);
  });
}

function renderAnswers(){
  const list = $("answer-list");
  list.textContent = "";

  const line = (n, q, a) => {
    const row = document.createElement("div");
    row.className = "answer-row";

    const num = document.createElement("span");
    num.className = "answer-n";
    num.textContent = n;

    const text = document.createElement("span");
    text.className = "answer-q";
    text.textContent = q;

    const ans = document.createElement("span");
    ans.className = "answer-a";
    ans.textContent = a;

    row.append(num, text, ans);
    list.appendChild(row);
  };

  if (age) line("-", "Are you above or below 18?", age);

  QUESTIONS.forEach((item, i) => {
    const pick = picks[i];
    line(i + 1, item.q, pick === undefined ? "-" : scaleOf(item)[pick]);
  });
}

/* ---------------- input ---------------- */

document.addEventListener("keydown", e => {
  if (screens.check.classList.contains("on")){
    if (e.key === "Enter") { e.preventDefault(); answerChallenge(true); }
    if (e.key === "Escape"){ e.preventDefault(); answerChallenge(false); }
    return;
  }

  if (!screens.quiz.classList.contains("on")) return;

  switch (e.key){
    case "ArrowLeft":
    case "ArrowUp":   e.preventDefault(); moveTo(hover - 1); break;
    case "ArrowRight":
    case "ArrowDown": e.preventDefault(); moveTo(hover + 1); break;
    case "Enter":
    case " ":         e.preventDefault(); choose(hover); break;
    case "Backspace": e.preventDefault(); back(); break;
    default:
      if (e.key >= "1" && e.key <= "9"){
        const i = Number(e.key) - 1;
        if (i < steps.length) choose(i);
      }
  }
});

window.addEventListener("resize", place);

/* ---------------- boot ---------------- */

const cursorImg = $("crest-cursor");
cursorImg.addEventListener("error", () => {
  cursorImg.hidden = true;
  $("crest-fallback").hidden = false;
});

[cursorImg, $("crest-start")].forEach(img => { img.src = asset(CREST); });

$("title").textContent = QUIZ_TITLE;
$("intro").textContent = QUIZ_INTRO;
standing.textContent = STANDING_QUESTION;

loadSettings();
initAudio();
applySettings();

/* settings panel */
const cog = $("cog");
const panel = $("settings");

cog.addEventListener("click", e => {
  e.stopPropagation();
  const open = panel.classList.toggle("open");
  cog.setAttribute("aria-expanded", String(open));
});

panel.addEventListener("click", e => e.stopPropagation());

document.addEventListener("click", () => {
  unlockAudio();                 /* any click counts as the gesture */
  panel.classList.remove("open");
  cog.setAttribute("aria-expanded", "false");
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && panel.classList.contains("open")){
    panel.classList.remove("open");
    cog.setAttribute("aria-expanded", "false");
  }
});

$("set-background").addEventListener("click", () => {
  settings.background = !settings.background;
  saveSettings();
  applySettings();
});

$("set-music").addEventListener("input", e => {
  settings.music = Number(e.target.value);
  $("music-value").textContent = settings.music;
  saveSettings();
  applyMusic();
});

$("set-sound").addEventListener("input", e => {
  settings.sound = Number(e.target.value);
  $("sound-value").textContent = settings.sound;
  saveSettings();
});

/* buttons */
$("begin").addEventListener("click", () => {
  unlockAudio();
  musicWanted = true;        // a real gesture: browsers will allow audio now
  applyMusic();
  show("age");
});

function answerAge(value){
  age = value;
  start();
}

$("age-over").addEventListener("click", () => answerAge("18 or over"));
$("age-under").addEventListener("click", () => answerAge("Under 18"));
$("back").addEventListener("click", back);
$("say-yes").addEventListener("click", () => answerChallenge(true));
$("say-no").addEventListener("click", () => answerChallenge(false));
$("see-vessels").addEventListener("click", () => { renderVessels(); show("vessels"); });
$("see-answers").addEventListener("click", () => { renderAnswers(); show("answers"); });
$("vessels-back").addEventListener("click", () => show("result"));
$("answers-back").addEventListener("click", () => show("result"));

$("reset").addEventListener("click", () => {
  clearRun();
  picks = [];
  age = null;
  index = 0;
  useAccent(null);
  useBackground(null);
  useMusic(null);
  standing.hidden = true;
  show("start");
});

/* a finished run comes back to the result until it is reset */
const saved = loadRun();
if (saved && Array.isArray(saved.picks) && saved.picks.length === QUESTIONS.length){
  picks = saved.picks;
  age = saved.age || null;
  finish(saved.wight ? WIGHT : null);
}
</script>
